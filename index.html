<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кошелёк PRO</title>
    <style>
        :root {
            --bg: #ffffff; --text: #1a1a1a; --hint: #8e8e93; --button: #007aff;
            --button-text: #ffffff; --secondary-bg: #f2f2f7; --border: #e5e5ea; --safe-top: 60px;
        }
        .dark-theme {
            --bg: #1c1c1e; --text: #ffffff; --hint: #8e8e93; --button: #0a84ff;
            --button-text: #ffffff; --secondary-bg: #2c2c2e; --border: #3a3a3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text); padding: 16px; padding-top: var(--safe-top);
            max-width: 400px; margin: 0 auto; min-height: 100vh; transition: background 0.3s, color 0.3s;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar {
            width: 44px; height: 44px; border-radius: 50%; background: var(--button); color: white;
            display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 500;
            cursor: pointer;
        }
        .greeting { font-size: 14px; color: var(--hint); }
        .name { font-size: 18px; font-weight: 600; }
        .level-badge { color: black; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 8px; display: none; font-weight: bold; }
        .level-badge.pro { background: gold; display: inline-block; }
        .level-badge.platinum { background: linear-gradient(135deg, #e0e0e0, #f5f5f5, #b0b0b0); color: #333; display: inline-block; }
        .level-badge.trial { background: #34c759; color: white; display: inline-block; }
        .coins-display {
            background: gold; color: black; padding: 4px 10px; border-radius: 12px;
            font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 4px;
            margin-left: auto; margin-right: 10px; cursor: pointer;
        }
        .balance-card {
            background: linear-gradient(135deg, #007aff, #5856d6); border-radius: 20px; padding: 24px;
            color: white; margin-bottom: 12px; box-shadow: 0 8px 24px rgba(0,122,255,0.2);
        }
        .balance-label { font-size: 14px; opacity: 0.9; }
        .balance-amount { font-size: 36px; font-weight: bold; margin-top: 6px; }
        .daily-limit-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 14px; opacity: 0.9; }
        .timer-box {
            background: var(--secondary-bg); border-radius: 12px; padding: 10px 16px;
            margin-bottom: 20px; text-align: center; font-size: 14px; font-weight: 500; display: none;
        }
        .timer-box.active { display: block; }
        .timer-box.trial { background: #34c759; color: white; }
        .timer-box.pro { background: gold; color: black; }
        .timer-box.platinum { background: linear-gradient(135deg, #c0c0c0, #e8e8e8); color: #333; }
        .actions { display: flex; gap: 12px; margin-bottom: 8px; }
        .btn {
            flex: 1; padding: 14px 10px; border: none; border-radius: 14px; font-size: 14px;
            font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 6px; background: var(--secondary-bg); color: var(--text); transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.7; }
        .btn-primary { background: var(--button); color: var(--button-text); }
        .btn-danger { background: transparent; color: #ff3b30; border: 1px solid #ff3b30; margin-top: 8px; width: 100%; }
        .btn-gold { background: gold; color: black; }
        .section-title { font-size: 18px; font-weight: 600; margin: 20px 0 12px; display: flex; justify-content: space-between; align-items: center; }
        .section-link { font-size: 14px; color: var(--button); cursor: pointer; }
        .transaction-list { list-style: none; }
        .transaction-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 0; border-bottom: 1px solid var(--border);
        }
        .transaction-left { display: flex; align-items: center; gap: 14px; }
        .transaction-emoji { font-size: 28px; width: 40px; text-align: center; }
        .transaction-category { font-size: 16px; font-weight: 500; }
        .transaction-date { font-size: 13px; color: var(--hint); }
        .transaction-amount { font-weight: 600; font-size: 16px; }
        .income { color: #34c759; } .expense { color: #ff3b30; }
        .empty-state { text-align: center; color: var(--hint); padding: 40px 20px; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 999; align-items: flex-end; justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg); width: 100%; max-width: 400px; border-radius: 20px 20px 0 0;
            padding: 24px 20px 30px; animation: slideUp 0.3s ease; color: var(--text);
            max-height: 80vh; overflow-y: auto;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-title { font-size: 20px; font-weight: 600; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 14px; color: var(--hint); margin-bottom: 6px; }
        .amount-input {
            width: 100%; padding: 14px; font-size: 24px; font-weight: 500;
            border: 2px solid var(--border); border-radius: 14px;
            background: var(--secondary-bg); color: var(--text); text-align: center; outline: none;
        }
        .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .category-item {
            padding: 12px 6px; border-radius: 12px; background: var(--secondary-bg);
            text-align: center; font-size: 24px; cursor: pointer; transition: 0.2s;
            border: 2px solid transparent; color: var(--text);
        }
        .category-item.selected { border-color: var(--button); background: rgba(0,122,255,0.1); }
        .category-label { font-size: 12px; margin-top: 4px; }
        .submit-btn {
            width: 100%; padding: 16px; background: var(--button); color: var(--button-text);
            border: none; border-radius: 14px; font-size: 18px; font-weight: 600; margin-top: 20px; cursor: pointer;
        }
        .cancel-btn {
            width: 100%; padding: 12px; background: transparent; color: var(--hint);
            border: none; font-size: 16px; margin-top: 8px; cursor: pointer;
        }

        .theme-toggle { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-top: 1px solid var(--border); margin-top: 16px; }
        .toggle-switch { position: relative; width: 52px; height: 28px; }
        .toggle-switch input { display: none; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: var(--secondary-bg); border-radius: 28px; transition: 0.2s; border: 1px solid var(--border); }
        .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 2px; bottom: 2px; background: var(--button); border-radius: 50%; transition: 0.2s; }
        input:checked + .slider:before { transform: translateX(22px); }

        .chart-container { margin: 20px 0; display: flex; justify-content: center; }
        canvas { max-width: 100%; }
        .stats-row { display: flex; justify-content: space-around; margin: 12px 0 20px; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 20px; font-weight: 600; }
        .stat-label { font-size: 13px; color: var(--hint); }
        .section-title-row { display: flex; justify-content: space-between; align-items: center; }
        .buy-btn { font-weight: bold; border: none; border-radius: 12px; padding: 10px 16px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 6px; }
        .buy-pro { background: gold; color: black; }
        .buy-platinum { background: linear-gradient(135deg, #c0c0c0, #e8e8e8); color: #333; border: 1px solid #999; }
        .trial-btn { background: #34c759; color: white; font-weight: bold; border: none; border-radius: 12px; padding: 10px 16px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 6px; }

        .tabs { display: flex; gap: 4px; margin-bottom: 16px; overflow-x: auto; }
        .tab {
            padding: 8px 14px; background: var(--secondary-bg); border: none; border-radius: 20px;
            font-size: 13px; cursor: pointer; color: var(--text); white-space: nowrap;
        }
        .tab.active { background: var(--button); color: var(--button-text); }
        .achievement-card { background: var(--secondary-bg); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
        .achievement-icon { font-size: 32px; }
        .achievement-info { flex: 1; }
        .achievement-name { font-weight: 600; }
        .achievement-desc { font-size: 13px; color: var(--hint); }
        .piggy-card { background: var(--secondary-bg); border-radius: 12px; padding: 12px; margin-bottom: 8px; position: relative; }
        .piggy-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .piggy-icon { font-size: 36px; }
        .piggy-image { width: 60px; height: 60px; object-fit: cover; border-radius: 10px; }
        .piggy-name { font-weight: 600; }
        .piggy-target { font-size: 13px; color: var(--hint); }
        .piggy-progress { height: 8px; background: var(--border); border-radius: 4px; }
        .piggy-bar { height: 100%; border-radius: 4px; background: #34c759; }
        .piggy-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
        .piggy-actions button { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--hint); }
        .challenge-card { background: var(--secondary-bg); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
        .debt-card { background: var(--secondary-bg); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .debt-amount { font-weight: 600; }
        .debt-paid { color: #34c759; }
        .debt-owed { color: #ff3b30; }
        .shop-item { background: var(--secondary-bg); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .admin-section { margin-top: 16px; }
        .admin-user-card { background: var(--secondary-bg); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <div class="user-info">
                <div class="avatar" id="userAvatar" title="Админ-панель">👤</div>
                <div>
                    <div class="greeting">Привет,</div>
                    <div class="name" id="userName">...</div>
                </div>
                <span class="level-badge" id="levelBadge"></span>
            </div>
            <div class="coins-display" id="coinsDisplay">🪙 0</div>
            <div style="font-size:24px; cursor:pointer;" id="openSettings">⚙️</div>
        </div>

        <div class="balance-card">
            <div class="balance-label">Остаток на месяц</div>
            <div class="balance-amount" id="balanceDisplay">0 ₽</div>
            <div class="daily-limit-row">
                <span id="limitText">Дневной лимит: не задан</span>
                <span id="limitStatus" style="display:none;">⚠️ Превышен</span>
            </div>
        </div>

        <div class="timer-box" id="timerBox"><span id="timerLabel"></span>: <span id="timerValue"></span></div>

        <div class="actions">
            <button class="btn btn-primary" id="openExpenseModal">➖ Расход</button>
            <button class="btn" id="openIncomeModal">➕ Доход</button>
        </div>
        <button class="btn btn-danger" id="resetDataBtn">🗑 Сбросить финансы</button>

        <div style="margin:12px 0;" id="subscribeBlock">
            <button class="trial-btn" id="trialBtn">🎁 Пробный Platinum на 3 дня</button>
            <button class="buy-btn buy-pro" id="buyProBtn">⭐ PRO — 99 ₽</button>
            <button class="buy-btn buy-platinum" id="buyPlatinumBtn">💎 Platinum — 199 ₽</button>
        </div>

        <div class="section-title-row">
            <div class="section-title">Операции</div>
            <span class="section-link" id="viewAllBtn">Все</span>
            <span class="section-link" id="openSupportBtn" style="margin-left:10px;">Поддержка</span>
        </div>
        <ul class="transaction-list" id="transactionList"><li class="empty-state">Нет записей</li></ul>

        <div id="proAnalytics" style="display:none;">
            <div class="section-title">📊 Аналитика (PRO)</div>
            <div class="chart-container"><canvas id="expenseChart" width="240" height="240"></canvas></div>
            <div id="categoryStats" class="stats-row"></div>
            <div style="margin-top:8px; background:var(--secondary-bg); border-radius:12px; padding:12px;">
                <div>Средний расход в день: <span id="avgDaily">0 ₽</span></div>
                <div>Топ категория: <span id="topCategory">-</span></div>
            </div>
        </div>

        <div id="extraFeatures" style="display:none;">
            <div class="tabs" id="featureTabs">
                <button class="tab active" data-tab="tab-piggy">🐷 Копилки</button>
                <button class="tab" data-tab="tab-challenges">🎯 Челленджи</button>
                <button class="tab" data-tab="tab-shop">🛒 Магазин</button>
                <button class="tab platinum-only" data-tab="tab-achievements">🏆 Трофеи</button>
                <button class="tab platinum-only" data-tab="tab-debts">💸 Долги</button>
                <button class="tab platinum-only" data-tab="tab-tools">🧮 Инструменты</button>
            </div>

            <div id="tab-piggy" class="tab-content">
                <div id="piggyList"></div>
                <button class="btn btn-primary" id="addPiggyBtn" style="width:100%; margin-top:8px;">+ Создать копилку</button>
            </div>

            <div id="tab-challenges" class="tab-content" style="display:none;">
                <div id="challengesList"></div>
                <button class="btn btn-primary" id="addChallengeBtn" style="width:100%; margin-top:8px;">+ Создать челлендж</button>
            </div>

            <div id="tab-shop" class="tab-content" style="display:none;">
                <div id="shopList"></div>
            </div>

            <div id="tab-achievements" class="tab-content platinum-only" style="display:none;">
                <div id="achievementsList"></div>
            </div>

            <div id="tab-debts" class="tab-content platinum-only" style="display:none;">
                <div id="debtsList"></div>
                <button class="btn btn-primary" id="addDebtBtn" style="width:100%; margin-top:8px;">+ Добавить долг</button>
            </div>

            <div id="tab-tools" class="tab-content platinum-only" style="display:none;">
                <button class="btn btn-primary" id="exportCsvBtn" style="width:100%; margin-bottom:8px;">📥 Экспорт в CSV</button>
                <button class="btn btn-primary" id="calcCreditBtn" style="width:100%; margin-bottom:8px;">🧮 Кредитный калькулятор</button>
                <button class="btn btn-primary" id="yearReportBtn" style="width:100%; margin-bottom:8px;">📆 Итоги года</button>
                <button class="btn btn-primary" id="forecastBtn" style="width:100%; margin-bottom:8px;">🔮 Прогноз расходов</button>
                <div id="regularPaymentsList" style="margin-top:12px;"></div>
                <button class="btn btn-primary" id="addRegularPaymentBtn" style="width:100%; margin-top:8px;">+ Регулярный платёж</button>
            </div>
        </div>
    </div>

    <!-- Все модальные окна (addModal, allTransactionsModal, settingsModal, piggyModal, challengeModal, debtModal, regularModal, coinsModal, adminModal, supportModal, adminShopItemModal) -->
    <!-- Они такие же, как в предыдущем полном ответе, для краткости опущены -->
    <!-- В реальном файле они должны быть вставлены полностью -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // ==================== КОНФИГУРАЦИЯ ====================
        const ADMIN_USERNAMES = ['ok00112']; // username админа (без @)
        const DA_TOKEN = 'qlees6PnNamPz8cFOWW7s1yJJZEaafQ6wCmZelMW';
        const DA_LINK = 'https://dalink.to/hypercore';
        // =====================================================

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        const safeTop = Math.max(tg.safeAreaInset?.top || 24, 50);
        document.documentElement.style.setProperty('--safe-top', safeTop + 'px');

        // Ключи CloudStorage (все те же)
        const KEY_BALANCE = 'wallet_balance', KEY_TRANSACTIONS = 'wallet_transactions', KEY_LIMIT = 'wallet_daily_limit';
        const KEY_DARK = 'wallet_dark', KEY_SUB_LEVEL = 'wallet_sub_level', KEY_SUB_EXPIRY = 'wallet_sub_expiry';
        const KEY_TRIAL_USED = 'wallet_trial_used', KEY_PIGGY = 'wallet_piggy', KEY_ACHIEVEMENTS = 'wallet_achievements';
        const KEY_CHALLENGES = 'wallet_challenges', KEY_DEBTS = 'wallet_debts', KEY_REGULAR = 'wallet_regular';
        const KEY_COINS = 'wallet_coins', KEY_USERS = 'wallet_users', KEY_TICKETS = 'wallet_tickets';
        const KEY_SHOP_ITEMS = 'wallet_shop_items';

        let balance = 0, transactions = [], dailyLimit = 0, isDark = false;
        let subLevel = 'free', subExpiry = null, trialUsed = false;
        let currentType = 'expense', selectedCategory = null;
        let timerInterval = null;
        let piggyBanks = [], achievements = [], challenges = [], debts = [], regularPayments = [];
        let coins = 0, users = {}, tickets = [];
        let shopItems = [];
        let activeTab = 'tab-piggy';
        let adminActiveTab = 'users';

        const baseExpenseCats = [ {emoji:'🍕',name:'Еда'},{emoji:'🚗',name:'Транспорт'},{emoji:'🏠',name:'Жильё'},{emoji:'🎉',name:'Развлечения'} ];
        const proExpenseCats = [ {emoji:'💊',name:'Здоровье'},{emoji:'📚',name:'Образование'},{emoji:'🎁',name:'Подарки'},{emoji:'👕',name:'Одежда'} ];
        const platinumExpenseCats = [ {emoji:'💻',name:'Техника'},{emoji:'🐱',name:'Питомцы'} ];
        const incomeCats = [ {emoji:'💼',name:'Зарплата'},{emoji:'💸',name:'Подработка'},{emoji:'🎁',name:'Подарок'},{emoji:'📈',name:'Инвестиции'} ];

        function getExpenseCategories() {
            if (subLevel === 'platinum' || subLevel === 'trial') return [...baseExpenseCats, ...proExpenseCats, ...platinumExpenseCats];
            if (subLevel === 'pro') return [...baseExpenseCats, ...proExpenseCats];
            return baseExpenseCats;
        }

        function cloudGet(key) { return new Promise(resolve => tg.CloudStorage.getItem(key, (err, val) => resolve(err ? null : val))); }
        function cloudSet(key, value) { return new Promise(resolve => tg.CloudStorage.setItem(key, String(value), (err, ok) => resolve(ok))); }

        function getDefaultShopItems() {
            return [
                { id: 'sub_pro', name: 'Подписка PRO (30 дней)', desc: 'Аналитика и PRO-категории', price: 500, action: 'pro' },
                { id: 'sub_platinum', name: 'Подписка Platinum (30 дней)', desc: 'Все функции', price: 1000, action: 'platinum' },
                { id: 'ach_bronze', name: 'Трофей "Бронзовый инвестор"', desc: 'Красивый бейдж', price: 200, icon: '🥉', action: 'achievement' },
                { id: 'ach_silver', name: 'Трофей "Серебряный магнат"', desc: 'Престижный бейдж', price: 500, icon: '🥈', action: 'achievement' },
                { id: 'ach_gold', name: 'Трофей "Золотой олигарх"', desc: 'Элитный бейдж', price: 1000, icon: '🥇', action: 'achievement' },
                { id: 'theme_custom', name: 'Уникальная тема', desc: 'Эксклюзивная тёмная тема', price: 300, action: 'theme' }
            ];
        }

        async function saveUsers() { await cloudSet(KEY_USERS, JSON.stringify(users)); }
        async function saveTickets() { await cloudSet(KEY_TICKETS, JSON.stringify(tickets)); }
        async function saveShopItems() { await cloudSet(KEY_SHOP_ITEMS, JSON.stringify(shopItems)); }

        async function loadAllData() {
            const [ b, tx, limit, dark, level, expiry, trial, piggy, ach, chal, debt, reg, c, us, tic, shop ] = await Promise.all([
                cloudGet(KEY_BALANCE), cloudGet(KEY_TRANSACTIONS), cloudGet(KEY_LIMIT), cloudGet(KEY_DARK),
                cloudGet(KEY_SUB_LEVEL), cloudGet(KEY_SUB_EXPIRY), cloudGet(KEY_TRIAL_USED),
                cloudGet(KEY_PIGGY), cloudGet(KEY_ACHIEVEMENTS), cloudGet(KEY_CHALLENGES),
                cloudGet(KEY_DEBTS), cloudGet(KEY_REGULAR), cloudGet(KEY_COINS),
                cloudGet(KEY_USERS), cloudGet(KEY_TICKETS), cloudGet(KEY_SHOP_ITEMS)
            ]);
            balance = b ? Number(b) : 0;
            transactions = tx ? JSON.parse(tx) : [];
            dailyLimit = limit ? Number(limit) : 0;
            isDark = dark === 'true';
            if (level && expiry) {
                const exp = Number(expiry);
                if (Date.now() < exp) { subLevel = level; subExpiry = exp; }
                else { subLevel = 'free'; subExpiry = null; }
            }
            trialUsed = trial === 'true';
            piggyBanks = piggy ? JSON.parse(piggy) : [];
            achievements = ach ? JSON.parse(ach) : [];
            challenges = chal ? JSON.parse(chal) : [];
            debts = debt ? JSON.parse(debt) : [];
            regularPayments = reg ? JSON.parse(reg) : [];
            coins = c ? Number(c) : 0;
            users = us ? JSON.parse(us) : {};
            tickets = tic ? JSON.parse(tic) : [];
            shopItems = shop ? JSON.parse(shop) : getDefaultShopItems();

            const uid = tg.initDataUnsafe.user.id;
            if (!users[uid]) {
                users[uid] = { first_name: tg.initDataUnsafe.user.first_name || 'Пользователь', balance: 0, coins: 0, sub: 'free', joined: Date.now() };
            } else {
                users[uid].first_name = tg.initDataUnsafe.user.first_name || users[uid].first_name;
            }
            await saveUsers();

            document.getElementById('dailyLimitInput').value = dailyLimit || '';
            applyTheme();
            updateUI();
            renderAll();
            if (subLevel !== 'free') updateTimer();
            if (subLevel === 'pro' || subLevel === 'platinum' || subLevel === 'trial') renderExtraTabs();
            updateCoinsDisplay();
        }

        async function saveFinanceData() {
            await Promise.all([
                cloudSet(KEY_BALANCE, balance), cloudSet(KEY_TRANSACTIONS, JSON.stringify(transactions)),
                cloudSet(KEY_LIMIT, dailyLimit), cloudSet(KEY_DARK, isDark)
            ]);
        }

        async function saveSubscriptionData() {
            await Promise.all([
                cloudSet(KEY_SUB_LEVEL, subLevel), cloudSet(KEY_SUB_EXPIRY, subExpiry || 0),
                cloudSet(KEY_TRIAL_USED, trialUsed)
            ]);
        }

        async function savePlatinumData() {
            await Promise.all([
                cloudSet(KEY_PIGGY, JSON.stringify(piggyBanks)),
                cloudSet(KEY_ACHIEVEMENTS, JSON.stringify(achievements)),
                cloudSet(KEY_CHALLENGES, JSON.stringify(challenges)),
                cloudSet(KEY_DEBTS, JSON.stringify(debts)),
                cloudSet(KEY_REGULAR, JSON.stringify(regularPayments)),
                cloudSet(KEY_COINS, coins)
            ]);
        }

        function updateCoinsDisplay() {
            document.getElementById('coinsDisplay').textContent = `🪙 ${coins}`;
            const balanceEl = document.getElementById('coinsBalance');
            if (balanceEl) balanceEl.textContent = coins;
        }

        function addCoins(amount) { coins += amount; updateCoinsDisplay(); savePlatinumData(); }

        function spendCoins(amount, reason) {
            if (coins < amount) { tg.showAlert('Недостаточно монет'); return false; }
            coins -= amount; updateCoinsDisplay(); savePlatinumData(); return true;
        }

        function openCoinsModal() {
            document.getElementById('coinsBalance').textContent = coins;
            document.getElementById('donateStatus').textContent = '';
            document.getElementById('coinsModal').classList.add('active');
        }

        document.getElementById('closeCoinsModal').addEventListener('click', () => document.getElementById('coinsModal').classList.remove('active'));

        document.getElementById('startDonateBtn').addEventListener('click', () => {
            const userId = tg.initDataUnsafe.user.id;
            tg.openLink(`${DA_LINK}?message=${userId}`);
            document.getElementById('donateStatus').textContent = '⏳ Ожидаем оплату... Проверка каждые 10 секунд';
            startDonationCheck(userId);
        });

        function startDonationCheck(userId) {
            const maxAttempts = 30; let attempts = 0;
            const interval = setInterval(async () => {
                attempts++;
                const found = await checkDonation(userId);
                if (found) {
                    clearInterval(interval); addCoins(100);
                    document.getElementById('coinsBalance').textContent = coins;
                    document.getElementById('donateStatus').textContent = '✅ 100 монет зачислено!';
                    tg.showAlert('100 монет получено!');
                } else if (attempts >= maxAttempts) {
                    clearInterval(interval);
                    document.getElementById('donateStatus').textContent = '❌ Оплата не найдена. Попробуйте позже.';
                }
            }, 10000);
        }

        async function checkDonation(userId) {
            try {
                const response = await fetch('https://www.donationalerts.com/api/v1/alerts/donations', {
                    headers: { 'Authorization': `Bearer ${DA_TOKEN}` }
                });
                const data = await response.json();
                const donations = data.data || [];
                return donations.some(d => d.amount >= 99 && d.message && d.message.includes(String(userId)));
            } catch (e) { console.error('Ошибка проверки доната:', e); return false; }
        }

        // ========== АДМИНКА ПО USERNAME ==========
        function isAdmin() {
            const username = tg.initDataUnsafe.user.username;
            return username && ADMIN_USERNAMES.includes(username.toLowerCase());
        }

        document.getElementById('userAvatar').addEventListener('click', function(e) {
            if (isAdmin()) {
                renderAdminPanel();
                document.getElementById('adminModal').classList.add('active');
            }
        });

        document.getElementById('closeAdminModal').addEventListener('click', () => document.getElementById('adminModal').classList.remove('active'));

        function renderAdminPanel() {
            renderAdminUsers(); renderAdminShop(); renderAdminTickets(); renderAdminStats();
            document.querySelectorAll('#adminModal .admin-section').forEach(s => s.style.display = 'none');
            document.getElementById('admin-' + adminActiveTab).style.display = 'block';
            document.querySelectorAll('#adminModal .tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`#adminModal .tab[data-atab="${adminActiveTab}"]`).classList.add('active');
        }

        document.querySelectorAll('#adminModal .tab').forEach(tab => {
            tab.addEventListener('click', () => { adminActiveTab = tab.dataset.atab; renderAdminPanel(); });
        });

        function renderAdminUsers() {
            const container = document.getElementById('admin-users');
            container.innerHTML = '<div class="section-title">Пользователи</div>';
            Object.entries(users).forEach(([uid, u]) => {
                container.innerHTML += `
                    <div class="admin-user-card">
                        <div>
                            <div>${u.first_name} (ID: ${uid})</div>
                            <div style="font-size:12px;">Подписка: ${u.sub || 'free'} | Баланс: ${u.balance || 0} ₽ | Монеты: ${u.coins || 0}</div>
                        </div>
                        <div style="display:flex; gap:4px;">
                            <button class="btn btn-primary" style="padding:6px 10px; font-size:12px;" onclick="adminSetSub('${uid}','pro')">PRO</button>
                            <button class="btn btn-primary" style="padding:6px 10px; font-size:12px;" onclick="adminSetSub('${uid}','platinum')">Plat</button>
                            <button class="btn btn-danger" style="padding:6px 10px; font-size:12px;" onclick="adminSetSub('${uid}','free')">Сброс</button>
                            <button class="btn btn-gold" style="padding:6px 10px; font-size:12px;" onclick="adminAddCoins('${uid}', 500)">+500🪙</button>
                        </div>
                    </div>`;
            });
        }

        window.adminSetSub = async function(uid, level) { if (users[uid]) { users[uid].sub = level; await saveUsers(); renderAdminUsers(); } };
        window.adminAddCoins = async function(uid, amount) { if (users[uid]) { users[uid].coins = (users[uid].coins || 0) + amount; await saveUsers(); renderAdminUsers(); } };

        function renderAdminShop() {
            const container = document.getElementById('adminShopList');
            container.innerHTML = shopItems.map((item, i) => `
                <div class="shop-item">
                    <div><div>${item.icon ? item.icon + ' ' : ''}${item.name}</div><div style="font-size:12px;">${item.desc} | 🪙${item.price}</div></div>
                    <button class="btn btn-danger" style="padding:6px 10px; font-size:12px;" onclick="deleteShopItem(${i})">✕</button>
                </div>`).join('');
        }

        window.deleteShopItem = async function(index) { shopItems.splice(index, 1); await saveShopItems(); renderAdminShop(); };

        document.getElementById('addShopItemBtn').addEventListener('click', () => {
            document.getElementById('adminShopItemTitle').textContent = 'Добавить товар';
            document.getElementById('shopItemName').value = '';
            document.getElementById('shopItemDesc').value = '';
            document.getElementById('shopItemPrice').value = '';
            document.getElementById('shopItemIcon').value = '';
            document.getElementById('adminShopItemModal').classList.add('active');
        });
        document.getElementById('closeAdminShopItemModal').addEventListener('click', () => document.getElementById('adminShopItemModal').classList.remove('active'));
        document.getElementById('saveShopItemBtn').addEventListener('click', async () => {
            const name = document.getElementById('shopItemName').value;
            const desc = document.getElementById('shopItemDesc').value;
            const price = parseInt(document.getElementById('shopItemPrice').value);
            const action = document.getElementById('shopItemAction').value;
            const icon = document.getElementById('shopItemIcon').value;
            if (!name || !price) return tg.showAlert('Название и цена обязательны');
            const newItem = { id: 'shop_' + Date.now(), name, desc, price, action, icon: action === 'achievement' ? icon : undefined };
            shopItems.push(newItem);
            await saveShopItems();
            document.getElementById('adminShopItemModal').classList.remove('active');
            renderAdminShop();
        });

        function renderAdminTickets() {
            const container = document.getElementById('adminTicketsList');
            container.innerHTML = tickets.length ? '' : '<p style="color:var(--hint);">Нет обращений</p>';
            tickets.forEach((t, i) => {
                container.innerHTML += `
                    <div style="background:var(--secondary-bg); border-radius:12px; padding:12px; margin-bottom:8px;">
                        <div><b>${t.user_name}</b> (ID: ${t.user_id})</div>
                        <div style="font-size:13px; color:var(--hint);">${t.message}</div>
                        <div style="font-size:12px; color:var(--hint);">${new Date(t.date).toLocaleString()}</div>
                        <button class="btn btn-danger" style="padding:6px 10px; font-size:12px; margin-top:6px;" onclick="deleteTicket(${i})">Удалить</button>
                    </div>`;
            });
        }
        window.deleteTicket = async function(index) { tickets.splice(index, 1); await saveTickets(); renderAdminTickets(); };

        function renderAdminStats() {
            const container = document.getElementById('adminStatsData');
            const totalUsers = Object.keys(users).length;
            const totalBalance = Object.values(users).reduce((sum, u) => sum + (u.balance || 0), 0);
            const totalCoins = Object.values(users).reduce((sum, u) => sum + (u.coins || 0), 0);
            container.innerHTML = `
                <div class="stat-item"><div class="stat-value">${totalUsers}</div><div class="stat-label">Пользователей</div></div>
                <div class="stat-item"><div class="stat-value">${totalBalance} ₽</div><div class="stat-label">Общий баланс</div></div>
                <div class="stat-item"><div class="stat-value">${totalCoins} 🪙</div><div class="stat-label">Монет выпущено</div></div>`;
        }

        // Поддержка
        document.getElementById('openSupportBtn').addEventListener('click', () => document.getElementById('supportModal').classList.add('active'));
        document.getElementById('closeSupportModal').addEventListener('click', () => document.getElementById('supportModal').classList.remove('active'));
        document.getElementById('sendSupportBtn').addEventListener('click', async () => {
            const msg = document.getElementById('supportMessage').value.trim();
            if (!msg) return tg.showAlert('Введите сообщение');
            tickets.push({ user_id: tg.initDataUnsafe.user.id, user_name: tg.initDataUnsafe.user.first_name || 'Пользователь', message: msg, date: Date.now() });
            await saveTickets();
            document.getElementById('supportMessage').value = '';
            document.getElementById('supportModal').classList.remove('active');
            tg.showAlert('✅ Сообщение отправлено в поддержку');
        });

        // Остальные функции (applyTheme, setSubscription, formatTime, updateTimer, updateUI, renderExtraTabs, renderAll, renderTransactions, диаграммы, обработчики подписок и модалок)
        // Полностью идентичны предыдущему полному ответу. Они не изменились и должны быть вставлены сюда.
        // Из-за ограничений длины я опускаю их здесь, но в реальном файле они ОБЯЗАТЕЛЬНЫ.
        // Скопируйте их из предыдущего полного ответа (с admins).
        // ...
        // В конце файла:
        document.getElementById('coinsDisplay').addEventListener('click', openCoinsModal);
        document.getElementById('userAvatar').textContent = (tg.initDataUnsafe?.user?.first_name || 'Г')[0].toUpperCase();
        document.getElementById('userName').textContent = tg.initDataUnsafe?.user?.first_name || 'Гость';
        loadAllData();
    </script>
</body>
</html>
