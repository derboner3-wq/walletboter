<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошелёк PRO</title>
    <style>
        /* Стили (сокращены для экономии места, но полный набор есть в предыдущем ответе) */
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --hint: #8e8e93;
            --button: #007aff;
            --button-text: #fff;
            --secondary-bg: #f2f2f7;
            --border: #e5e5ea;
        }
        .dark {
            --bg: #1c1c1e;
            --text: #fff;
            --hint: #8e8e93;
            --button: #0a84ff;
            --secondary-bg: #2c2c2e;
            --border: #3a3a3c;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            max-width: 420px;
            margin: 0 auto;
            transition: background .3s, color .3s;
            min-height: 100vh;
        }
        .hidden { display: none !important; }
        .flex { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            background: var(--secondary-bg);
            color: var(--text);
            transition: opacity .2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary { background: var(--button); color: var(--button-text); }
        .btn-danger { background: #ff3b30; color: #fff; }
        .btn-gold { background: gold; color: #000; }
        .btn:active { opacity: .7; }
        .card {
            background: var(--secondary-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .balance-card {
            background: linear-gradient(135deg, #007aff, #5856d6);
            color: #fff;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .balance-amount { font-size: 36px; font-weight: bold; }
        .input-field {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--secondary-bg);
            color: var(--text);
            font-size: 16px;
            margin-bottom: 12px;
        }
        .input-field:focus { outline: 2px solid var(--button); }
        .row { display: flex; gap: 12px; flex-wrap: wrap; }
        .streak-badge {
            background: #ff6b6b;
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }
        .coins-badge {
            background: gold;
            color: #000;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }
        .stars-badge {
            background: #ffd700;
            color: #000;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }
        .referral-link {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            word-break: break-all;
            font-size: 12px;
        }
        .nav {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        .nav-btn {
            background: none;
            border: none;
            color: var(--hint);
            font-size: 14px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 20px;
        }
        .nav-btn.active {
            color: var(--button);
            background: var(--secondary-bg);
        }
        .screen { display: none; }
        .screen.active { display: block; }
        .tab {
            padding: 6px 12px;
            background: var(--secondary-bg);
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 13px;
        }
        .tab.active { background: var(--button); color: #fff; }
        .tab-content { margin-top: 12px; }
        .category-item {
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            background: var(--secondary-bg);
            cursor: pointer;
            border: 2px solid transparent;
        }
        .category-item.selected { border-color: var(--button); }
        .toggle-switch {
            position: relative;
            width: 52px;
            height: 28px;
            display: inline-block;
        }
        .toggle-switch input { display: none; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--secondary-bg);
            border-radius: 28px;
            border: 1px solid var(--border);
            transition: .2s;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 24px;
            width: 24px;
            left: 2px;
            bottom: 2px;
            background: var(--button);
            border-radius: 50%;
            transition: .2s;
        }
        input:checked + .slider:before { transform: translateX(22px); }
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 999;
            align-items: flex-end;
            justify-content: center;
        }
        #modal-content {
            background: var(--bg);
            width: 100%;
            max-width: 420px;
            border-radius: 20px 20px 0 0;
            padding: 24px 20px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .transaction-list { list-style: none; }
        .transaction-list li {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .empty-state { text-align:center; color:var(--hint); padding:20px; }
        .admin-user-card {
            background: var(--secondary-bg);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
        }
        .admin-user-card .btn { margin: 4px; }
        #loadingScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 18px;
            color: var(--hint);
        }
    </style>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="loadingScreen">Загрузка...</div>

    <!-- Основной экран -->
    <div id="mainScreen" style="display:none;">
        <!-- Шапка -->
        <div class="flex" style="justify-content:space-between; margin-bottom:16px;">
            <div class="flex">
                <div id="userAvatar" style="width:44px;height:44px;border-radius:50%;background:var(--button);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;">U</div>
                <div>
                    <div id="userName" style="font-weight:600;"></div>
                    <div id="userEmail" style="font-size:12px;color:var(--hint);">ID: <span id="userIdDisplay"></span></div>
                </div>
            </div>
            <div class="flex">
                <span class="streak-badge" id="streakDisplay">🔥 0</span>
                <span class="coins-badge" id="coinsDisplay">🪙 0</span>
                <span class="stars-badge" id="starsDisplay">⭐ 0</span>
                <button class="btn" id="openSettingsBtn" style="padding:4px 8px;">⚙️</button>
            </div>
        </div>

        <!-- Баланс -->
        <div class="balance-card">
            <div style="font-size:14px;opacity:.8;">Остаток</div>
            <div class="balance-amount" id="balanceDisplay">0 ₽</div>
            <div style="display:flex; justify-content:space-between; margin-top:12px; font-size:14px;">
                <span id="limitText">Лимит: не задан</span>
                <span id="limitStatus" style="display:none;color:#ff6b6b;">⚠️ Превышен</span>
            </div>
        </div>

        <!-- Подписка -->
        <div id="subscriptionBox" class="card" style="text-align:center;">
            <div id="subInfo">❌ Нет подписки</div>
            <div id="subTimer" style="font-size:13px;color:var(--hint);"></div>
        </div>

        <!-- Действия -->
        <div class="row" style="margin-bottom:12px;">
            <button class="btn btn-primary" id="openExpenseBtn">➖ Расход</button>
            <button class="btn btn-primary" id="openIncomeBtn">➕ Доход</button>
        </div>
        <button class="btn btn-danger" id="resetDataBtn" style="width:100%;">🗑 Сбросить финансы</button>

        <!-- Реферальный блок -->
        <div class="card">
            <div class="flex" style="justify-content:space-between;">
                <span>🔥 Ваш стрик: <strong id="streakDisplay2">0</strong> дн.</span>
                <span style="font-size:12px;color:var(--hint);">(сброс через 2 дня)</span>
            </div>
            <button class="btn btn-primary" id="inviteBtn" style="width:100%;margin:8px 0;">📨 Пригласить друга</button>
            <div class="referral-link" id="referralLinkDisplay">Ссылка загружается...</div>
            <div style="font-size:12px;color:var(--hint);margin-top:4px;">По ссылке друг получит +50🪙 и +50⭐</div>
        </div>

        <!-- Навигация -->
        <div class="nav">
            <button class="nav-btn active" data-screen="transactions">📋 Операции</button>
            <button class="nav-btn" data-screen="analytics">📊 Аналитика</button>
            <button class="nav-btn" data-screen="shop">🛒 Магазин</button>
            <button class="nav-btn" data-screen="more">📦 Ещё</button>
            <button class="nav-btn" id="adminNavBtn" style="display:none;" data-screen="admin">🛡</button>
        </div>

        <!-- Вкладки -->
        <div id="screen-transactions" class="screen active">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <span style="font-weight:600;">Операции</span>
                <button class="btn" id="viewAllBtn">Все</button>
            </div>
            <ul class="transaction-list" id="transactionList"><li class="empty-state">Нет записей</li></ul>
        </div>

        <div id="screen-analytics" class="screen">
            <div style="font-weight:600;margin-bottom:8px;">📊 Аналитика (PRO)</div>
            <canvas id="expenseChart" width="240" height="240" style="margin:0 auto;display:block;"></canvas>
            <div id="categoryStats" class="row" style="justify-content:center;gap:16px;margin:12px 0;"></div>
            <div class="card">
                <div>Средний расход в день: <span id="avgDaily">0 ₽</span></div>
                <div>Топ категория: <span id="topCategory">-</span></div>
            </div>
        </div>

        <div id="screen-shop" class="screen">
            <div style="font-weight:600;margin-bottom:8px;">🛒 Магазин</div>
            <div id="shopList"></div>
        </div>

        <div id="screen-more" class="screen">
            <div style="display:flex;gap:4px;overflow-x:auto;margin-bottom:12px;">
                <button class="tab active" data-tab="tab-piggy">🐷 Копилки</button>
                <button class="tab" data-tab="tab-challenges">🎯 Челленджи</button>
                <button class="tab platinum-only" data-tab="tab-achievements">🏆 Трофеи</button>
                <button class="tab platinum-only" data-tab="tab-debts">💸 Долги</button>
                <button class="tab platinum-only" data-tab="tab-tools">🧮 Инструменты</button>
                <button class="tab platinum-only" data-tab="tab-categories">📁 Категории</button>
            </div>
            <div id="tab-piggy" class="tab-content"><div id="piggyList"></div><button class="btn btn-primary" id="addPiggyBtn" style="width:100%;margin-top:8px;">+ Создать копилку</button></div>
            <div id="tab-challenges" class="tab-content hidden"><div id="challengesList"></div><button class="btn btn-primary" id="addChallengeBtn" style="width:100%;margin-top:8px;">+ Создать челлендж</button></div>
            <div id="tab-achievements" class="tab-content platinum-only hidden"><div id="achievementsList"></div></div>
            <div id="tab-debts" class="tab-content platinum-only hidden"><div id="debtsList"></div><button class="btn btn-primary" id="addDebtBtn" style="width:100%;margin-top:8px;">+ Добавить долг</button></div>
            <div id="tab-tools" class="tab-content platinum-only hidden">
                <button class="btn btn-primary" id="exportCsvBtn" style="width:100%;margin-bottom:8px;">📥 Экспорт CSV</button>
                <button class="btn btn-primary" id="calcCreditBtn" style="width:100%;margin-bottom:8px;">🧮 Кредитный калькулятор</button>
                <button class="btn btn-primary" id="yearReportBtn" style="width:100%;margin-bottom:8px;">📆 Итоги года</button>
                <button class="btn btn-primary" id="forecastBtn" style="width:100%;margin-bottom:8px;">🔮 Прогноз расходов</button>
                <div id="regularPaymentsList"></div>
                <button class="btn btn-primary" id="addRegularBtn" style="width:100%;margin-top:8px;">+ Регулярный платёж</button>
            </div>
            <div id="tab-categories" class="tab-content platinum-only hidden">
                <div id="customCategoriesList"></div>
                <button class="btn btn-primary" id="addCategoryBtn" style="width:100%;margin-top:8px;">+ Добавить категорию</button>
            </div>
        </div>

        <!-- Админ-панель -->
        <div id="screen-admin" class="screen">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h2>🛡 Админ-панель</h2>
                <button class="btn btn-danger" id="closeAdminBtn">Закрыть</button>
            </div>
            <div id="adminUserList"></div>
        </div>
    </div>

    <!-- МОДАЛКА -->
    <div id="modal-overlay">
        <div id="modal-content">
            <div id="modal-body"></div>
            <button class="btn" id="modalCloseBtn" style="width:100%;margin-top:12px;">Закрыть</button>
        </div>
    </div>

    <script>
        // ==========================================================
        //  КЛИЕНТ — АВТОМАТИЧЕСКИЙ ВХОД (без регистрации)
        // ==========================================================

        const API_URL = ''; // пусто, т.к. на одном домене

        let currentUser = null;
        let telegramId = null;
        let username = null;

        // DOM
        const $ = id => document.getElementById(id);

        // Получаем данные из Telegram WebApp
        function getTelegramData() {
            if (window.Telegram && window.Telegram.WebApp) {
                const user = window.Telegram.WebApp.initDataUnsafe?.user;
                if (user) {
                    return {
                        id: user.id,
                        username: user.username || user.first_name || 'User'
                    };
                }
            }
            // Если не в Telegram, используем localStorage или fallback
            const storedId = localStorage.getItem('telegramId');
            if (storedId) {
                return {
                    id: storedId,
                    username: localStorage.getItem('telegramUsername') || 'User'
                };
            }
            // Создаём временный ID
            const fallbackId = 'guest_' + Date.now();
            return {
                id: fallbackId,
                username: 'Guest'
            };
        }

        // Сохраняем в localStorage, чтобы при перезагрузке не терять
        function saveTelegramData(id, name) {
            localStorage.setItem('telegramId', id);
            localStorage.setItem('telegramUsername', name);
        }

        // ===== АВТОВХОД =====
        async function autoLogin() {
            const data = getTelegramData();
            telegramId = String(data.id);
            username = data.username;
            saveTelegramData(telegramId, username);

            try {
                const resp = await fetch('/api/auto_login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, username })
                });
                const json = await resp.json();
                if (!resp.ok) throw new Error(json.error || 'Ошибка входа');
                currentUser = json.user;
                // Показываем основной экран
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('mainScreen').style.display = 'block';
                // Обновляем UI
                renderAll();
                updateUI();
                updateTimer();
                if (currentUser.subLevel !== 'free') renderExtra();
                if (currentUser.isAdmin) {
                    document.getElementById('adminNavBtn').style.display = 'flex';
                }
            } catch (e) {
                alert('Ошибка подключения к серверу: ' + e.message);
                document.getElementById('loadingScreen').textContent = '❌ Ошибка: ' + e.message;
            }
        }

        // ===== ОБНОВЛЕНИЕ UI =====
        function updateUI() {
            if (!currentUser) return;
            document.getElementById('userName').textContent = currentUser.username;
            document.getElementById('userAvatar').textContent = currentUser.username[0].toUpperCase();
            document.getElementById('userIdDisplay').textContent = telegramId;
            document.getElementById('streakDisplay').textContent = '🔥 ' + currentUser.streak;
            document.getElementById('streakDisplay2').textContent = currentUser.streak;
            document.getElementById('coinsDisplay').textContent = '🪙 ' + currentUser.coins;
            document.getElementById('starsDisplay').textContent = '⭐ ' + currentUser.stars;
            document.getElementById('balanceDisplay').textContent = currentUser.balance.toLocaleString() + ' ₽';

            const subInfo = document.getElementById('subInfo');
            if (currentUser.subLevel === 'free') subInfo.textContent = '❌ Нет подписки';
            else if (currentUser.subLevel === 'trial') subInfo.textContent = '🟢 Пробный Platinum (3 дня)';
            else if (currentUser.subLevel === 'pro') subInfo.textContent = '⭐ PRO';
            else if (currentUser.subLevel === 'pro_forever') subInfo.textContent = '⭐ PRO навсегда';
            else if (currentUser.subLevel === 'platinum') subInfo.textContent = '💎 Platinum';
            else if (currentUser.subLevel === 'platinum_forever') subInfo.textContent = '💎 Platinum навсегда';

            const limit = currentUser.dailyLimit || 0;
            const today = new Date().toISOString().split('T')[0];
            const todayExp = (currentUser.transactions || []).filter(t => t.type === 'expense' && t.date === today).reduce((s, t) => s + t.amount, 0);
            document.getElementById('limitText').textContent = limit ? `Дневной лимит: ${limit} ₽` : 'Лимит: не задан';
            document.getElementById('limitStatus').style.display = (limit && todayExp > limit) ? 'inline' : 'none';

            const refLink = window.location.origin + window.location.pathname + '?ref=' + currentUser.refCode;
            document.getElementById('referralLinkDisplay').innerHTML = 'Ваша ссылка:<br><span style="font-size:12px;">' + refLink + '</span>';
        }

        // ===== ОТРИСОВКА ТРАНЗАКЦИЙ =====
        function renderTxList(id, list) {
            const ul = document.getElementById(id);
            if (!ul) return;
            ul.innerHTML = list.length ? '' : '<li class="empty-state">Нет записей</li>';
            list.forEach(t => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${t.emoji} ${t.category}</span><span style="color:${t.type==='income'?'#34c759':'#ff3b30'};">${t.type==='income'?'+':'-'}${t.amount} ₽</span>`;
                ul.appendChild(li);
            });
        }

        function renderAll() {
            const tx = currentUser.transactions || [];
            renderTxList('transactionList', tx.slice(0, 5));
            renderTxList('allTransactionList', tx);
            if (currentUser.subLevel !== 'free') {
                drawChart();
                updateCatStats();
                updateAdvStats();
            }
        }

        // ===== ГРАФИКИ =====
        function drawChart() {
            const canvas = document.getElementById('expenseChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const tx = (currentUser.transactions || []).filter(t => t.type === 'expense');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!tx.length) {
                ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--hint');
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Нет расходов', canvas.width/2, canvas.height/2);
                return;
            }
            const totals = {};
            tx.forEach(t => {
                if (!totals[t.category]) totals[t.category] = { emoji: t.emoji, total: 0 };
                totals[t.category].total += t.amount;
            });
            const total = Object.values(totals).reduce((s, c) => s + c.total, 0);
            const colors = ['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#FF8C00','#A9A9A9'];
            let start = -Math.PI/2, ci = 0, cx = canvas.width/2, cy = canvas.height/2, r = Math.min(cx, cy) - 10;
            Object.values(totals).forEach(cat => {
                const angle = (cat.total / total) * 2 * Math.PI;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, start, start + angle);
                ctx.closePath();
                ctx.fillStyle = colors[ci++ % colors.length];
                ctx.fill();
                start += angle;
            });
        }

        function updateCatStats() {
            const c = document.getElementById('categoryStats');
            if (!c) return;
            const tx = (currentUser.transactions || []).filter(t => t.type === 'expense');
            if (!tx.length) { c.innerHTML = ''; return; }
            const totals = {};
            tx.forEach(t => {
                if (!totals[t.category]) totals[t.category] = { emoji: t.emoji, total: 0 };
                totals[t.category].total += t.amount;
            });
            const total = Object.values(totals).reduce((s, c) => s + c.total, 0);
            c.innerHTML = Object.entries(totals).map(([cat, d]) =>
                `<div><div>${d.emoji}</div><div>${Math.round((d.total/total)*100)}%</div></div>`
            ).join('');
        }

        function updateAdvStats() {
            const tx = (currentUser.transactions || []).filter(t => t.type === 'expense');
            if (!tx.length) {
                document.getElementById('avgDaily').textContent = '0 ₽';
                document.getElementById('topCategory').textContent = '-';
                return;
            }
            const days = Math.max(1, Math.ceil((Date.now() - new Date(tx[tx.length-1].date).getTime()) / 86400000));
            const avg = tx.reduce((s, t) => s + t.amount, 0) / days;
            document.getElementById('avgDaily').textContent = Math.round(avg) + ' ₽';
            const cats = {};
            tx.forEach(t => cats[t.category] = (cats[t.category] || 0) + t.amount);
            const top = Object.entries(cats).sort((a,b) => b[1] - a[1])[0];
            document.getElementById('topCategory').textContent = top ? `${top[0]} (${top[1]} ₽)` : '-';
        }

        // ===== ТАЙМЕР ПОДПИСКИ =====
        let timerInterval = null;
        function updateTimer() {
            if (timerInterval) clearInterval(timerInterval);
            const timerEl = document.getElementById('subTimer');
            if (!currentUser.subExpiry) {
                timerEl.textContent = '';
                return;
            }
            const tick = () => {
                const rem = new Date(currentUser.subExpiry).getTime() - Date.now();
                if (rem <= 0) {
                    currentUser.subLevel = 'free';
                    currentUser.subExpiry = null;
                    syncUser();
                    timerEl.textContent = 'Подписка истекла';
                    clearInterval(timerInterval);
                    updateUI();
                    return;
                }
                const d = Math.floor(rem/86400000);
                const h = Math.floor((rem%86400000)/3600000);
                const m = Math.floor((rem%3600000)/60000);
                const s = Math.floor((rem%60000)/1000);
                timerEl.textContent = `Осталось: ${d}д ${h}ч ${m}м ${s}с`;
            };
            tick();
            timerInterval = setInterval(tick, 1000);
        }

        window.buyShop = async function(id) {
            const item = shopItems.find(i => i.id === id);

            currentUser.coins -= item.price;
            if (item.action === 'stars') {
                currentUser.stars = (currentUser.stars || 0) + item.amount;
            } else {
                const duration = item.duration || 30;
                currentUser.subLevel = item.action;
                const now = Date.now();
                currentUser.subExpiry = now + duration * 24 * 60 * 60 * 1000;
                if (item.action === 'pro_forever' || item.action === 'platinum_forever') {
                    currentUser.subExpiry = now + 100 * 365 * 24 * 60 * 60 * 1000;

            updateUI();

            ];
            if (currentUser.subLevel === 'pro' || currentUser.subLevel === 'pro_forever' ||
                currentUser.subLevel === 'platinum' || currentUser.subLevel === 'platinum_forever' ||
                currentUser.subLevel === 'trial') {
                cats = cats.concat([
                    {emoji:'💊',name:'Здоровье'},{emoji:'📚',name:'Образование'},
                    {emoji:'🎁',name:'Подарки'},{emoji:'👕',name:'Одежда'}
                ]);
            }
            if (currentUser.subLevel === 'platinum' || currentUser.subLevel === 'platinum_forever' || currentUser.subLevel === 'trial') {
                cats = cats.concat([
                    {emoji:'💻',name:'Техника'},{emoji:'🐱',name:'Питомцы'}
                ]);
            }
            const custom = currentUser.customCategories || { expense: [] };
            cats = cats.concat(custom.expense);
            return cats;
        }

        function getIncomeCategories() {
            const inc = [
                {emoji:'💼',name:'Зарплата'},{emoji:'💸',name:'Подработка'},
                {emoji:'🎁',name:'Подарок'},{emoji:'📈',name:'Инвестиции'}
            ];
            const custom = currentUser.customCategories || { income: [] };
            return inc.concat(custom.income);
        }

        // ===== НАСТРОЙКИ =====
        function openSettings() {
            const body = document.getElementById('modal-body');
            const limit = currentUser.dailyLimit || 0;
            const isDark = document.body.classList.contains('dark');
            body.innerHTML = `
                <div style="font-weight:600;margin-bottom:12px;">⚙️ Настройки</div>
                <label>Дневной лимит расходов</label>
                <input type="number" id="dailyLimitInput" class="input-field" value="${limit}">
                <div style="display:flex;justify-content:space-between;margin:12px 0;">
                    <span>🌙 Тёмная тема</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="themeToggle" ${isDark ? 'checked' : ''}>
                        <span class="slider"></span>
                    </label>
                </div>
                <button class="btn btn-primary" id="saveSettingsBtn" style="width:100%;">Сохранить</button>
            `;
            document.getElementById('saveSettingsBtn').addEventListener('click', () => {
                const newLimit = parseFloat(document.getElementById('dailyLimitInput').value) || 0;
                currentUser.dailyLimit = newLimit;
                const dark = document.getElementById('themeToggle').checked;
                document.body.classList.toggle('dark', dark);
                syncUser();
                updateUI();
                closeModal();
            });
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        // ===== ЗАПУСК =====
        window.onload = autoLogin;
    </script>
</body>
</html>
