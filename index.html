<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошелёк PRO</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, sans-serif; background: #f2f2f7; padding: 20px; max-width: 420px; margin: 0 auto; }
        .card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .btn { padding: 10px 16px; border: none; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; background: #e5e5ea; color: #1a1a1a; transition: opacity .2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: #007aff; color: #fff; }
        .btn-danger { background: #ff3b30; color: #fff; }
        .btn-gold { background: #ffd700; color: #000; }
        .btn:active { opacity: .7; }
        .input-field { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e5e5ea; font-size: 16px; margin-bottom: 12px; background: #fff; }
        .flex { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .mt-8 { margin-top: 8px; }
        .mb-8 { margin-bottom: 8px; }

        .balance-card { background: linear-gradient(135deg, #007aff, #5856d6); color: #fff; border-radius: 20px; padding: 24px; margin-bottom: 16px; }
        .balance-amount { font-size: 36px; font-weight: bold; }

        .nav { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 16px; }
        .nav-btn { padding: 8px 14px; border: none; border-radius: 20px; background: #e5e5ea; cursor: pointer; font-size: 13px; }
        .nav-btn.active { background: #007aff; color: #fff; }

        .transaction-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e5e5ea; }
        .empty-state { color: #8e8e93; text-align: center; padding: 20px; }

        .admin-user-card { background: #f2f2f7; border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 13px; }
        .badge-streak { background: #ff6b6b; color: #fff; }
        .badge-coins { background: #ffd700; color: #000; }
        .badge-stars { background: #ffd700; color: #000; }

        .referral-link { background: #f2f2f7; padding: 8px; border-radius: 8px; word-break: break-all; font-size: 12px; margin-top: 6px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 999; align-items: flex-end; justify-content: center; }
        .modal-content { background: #fff; width: 100%; max-width: 420px; border-radius: 20px 20px 0 0; padding: 24px 20px; max-height: 80vh; overflow-y: auto; }

        .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }
        .category-item { text-align: center; padding: 8px; border-radius: 8px; background: #f2f2f7; cursor: pointer; border: 2px solid transparent; }
        .category-item.selected { border-color: #007aff; background: rgba(0,122,255,0.1); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tabs { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 12px; }
        .tab { padding: 8px 14px; border: none; border-radius: 20px; background: #e5e5ea; cursor: pointer; font-size: 13px; white-space: nowrap; }
        .tab.active { background: #007aff; color: #fff; }

        .platinum-only { display: none; }
        .platinum-only.visible { display: block; }
    </style>
</head>
<body>

    <!-- ===== ЭКРАН РЕГИСТРАЦИИ ===== -->
    <div id="registerScreen">
        <div class="card" style="max-width:360px;margin:40px auto;">
            <h2 class="text-center">📝 Регистрация</h2>
            <input type="email" id="regEmail" class="input-field" placeholder="Email">
            <input type="text" id="regUsername" class="input-field" placeholder="Telegram username (без @)">
            <button id="registerBtn" class="btn btn-primary" style="width:100%;">Зарегистрироваться</button>
            <div id="regError" style="color:#ff3b30; margin-top:10px; text-align:center;"></div>
        </div>
    </div>

    <!-- ===== ОСНОВНОЙ ЭКРАН ===== -->
    <div id="mainScreen" class="hidden">
        <!-- Шапка -->
        <div class="flex" style="justify-content:space-between; margin-bottom:12px;">
            <div class="flex">
                <div id="userAvatar" style="width:44px;height:44px;border-radius:50%;background:#007aff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;">U</div>
                <div>
                    <div id="userName" style="font-weight:600;"></div>
                    <div id="userEmail" style="font-size:12px;color:#8e8e93;"></div>
                </div>
            </div>
            <div class="flex">
                <span class="badge badge-streak" id="streakDisplay">🔥 0</span>
                <span class="badge badge-coins" id="coinsDisplay">🪙 0</span>
                <span class="badge badge-stars" id="starsDisplay">⭐ 0</span>
                <button class="btn" id="settingsBtn" style="padding:4px 8px;">⚙️</button>
            </div>
        </div>

        <!-- Баланс -->
        <div class="balance-card">
            <div style="font-size:14px;opacity:.8;">Остаток</div>
            <div class="balance-amount" id="balanceDisplay">0 ₽</div>
            <div class="flex" style="justify-content:space-between; margin-top:12px; font-size:14px;">
                <span id="limitText">Лимит: не задан</span>
                <span id="limitStatus" style="display:none;color:#ff6b6b;">⚠️ Превышен</span>
            </div>
        </div>

        <!-- Подписка -->
        <div class="card" id="subscriptionBox">
            <div id="subInfo">❌ Нет подписки</div>
            <div id="subTimer" style="font-size:13px;color:#8e8e93;"></div>
        </div>

        <!-- Кнопки действий -->
        <div class="flex" style="margin-bottom:8px;">
            <button class="btn btn-primary" id="expenseBtn" style="flex:1;">➖ Расход</button>
            <button class="btn btn-primary" id="incomeBtn" style="flex:1;">➕ Доход</button>
        </div>
        <button class="btn btn-danger" id="resetBtn" style="width:100%;">🗑 Сбросить финансы</button>

        <!-- Реферальный блок -->
        <div class="card">
            <div class="flex" style="justify-content:space-between;">
                <span>🔥 Ваш стрик: <strong id="streakDisplay2">0</strong> дн.</span>
                <span style="font-size:12px;color:#8e8e93;">(сброс через 2 дня)</span>
            </div>
            <button class="btn btn-primary" id="inviteBtn" style="width:100%;margin:8px 0;">📨 Пригласить друга</button>
            <div class="referral-link" id="referralLink">Ссылка загружается...</div>
            <div style="font-size:12px;color:#8e8e93;margin-top:4px;">За регистрацию по ссылке вы получите 100⭐, друг — 50🪙 + 50⭐</div>
        </div>

        <!-- Навигация -->
        <div class="nav">
            <button class="nav-btn active" data-screen="transactions">📋 Операции</button>
            <button class="nav-btn" data-screen="analytics">📊 Аналитика</button>
            <button class="nav-btn" data-screen="shop">🛒 Магазин</button>
            <button class="nav-btn" data-screen="more">📦 Ещё</button>
            <button class="nav-btn" id="adminNavBtn" style="display:none;" data-screen="admin">🛡</button>
        </div>

        <!-- Экраны -->
        <div id="screen-transactions" class="screen">
            <div id="transactionList"></div>
            <button class="btn" id="viewAllBtn" style="width:100%;margin-top:8px;">Показать все</button>
        </div>

        <div id="screen-analytics" class="screen hidden">
            <div style="font-weight:600;margin-bottom:12px;">📊 Аналитика (PRO)</div>
            <canvas id="expenseChart" width="240" height="240" style="display:block;margin:0 auto;"></canvas>
            <div id="categoryStats" class="flex" style="justify-content:center;gap:16px;margin:12px 0;"></div>
            <div class="card">
                <div>Средний расход в день: <span id="avgDaily">0 ₽</span></div>
                <div>Топ категория: <span id="topCategory">-</span></div>
            </div>
        </div>

        <div id="screen-shop" class="screen hidden">
            <div style="font-weight:600;margin-bottom:12px;">🛒 Магазин</div>
            <div id="shopList"></div>
        </div>

        <div id="screen-more" class="screen hidden">
            <div class="tabs">
                <button class="tab active" data-tab="piggy">🐷 Копилки</button>
                <button class="tab" data-tab="challenges">🎯 Челленджи</button>
                <button class="tab platinum-tab" data-tab="achievements">🏆 Трофеи</button>
                <button class="tab platinum-tab" data-tab="debts">💸 Долги</button>
                <button class="tab platinum-tab" data-tab="tools">🧮 Инструменты</button>
                <button class="tab platinum-tab" data-tab="categories">📁 Категории</button>
            </div>
            <div id="tab-piggy" class="tab-content active"><div id="piggyList"></div><button class="btn btn-primary" id="addPiggyBtn" style="width:100%;margin-top:8px;">+ Создать копилку</button></div>
            <div id="tab-challenges" class="tab-content"><div id="challengesList"></div><button class="btn btn-primary" id="addChallengeBtn" style="width:100%;margin-top:8px;">+ Создать челлендж</button></div>
            <div id="tab-achievements" class="tab-content platinum-only"><div id="achievementsList"></div></div>
            <div id="tab-debts" class="tab-content platinum-only"><div id="debtsList"></div><button class="btn btn-primary" id="addDebtBtn" style="width:100%;margin-top:8px;">+ Добавить долг</button></div>
            <div id="tab-tools" class="tab-content platinum-only">
                <button class="btn" id="exportBtn" style="width:100%;margin-bottom:8px;">📥 Экспорт CSV</button>
                <button class="btn" id="creditBtn" style="width:100%;margin-bottom:8px;">🧮 Кредитный калькулятор</button>
                <button class="btn" id="yearBtn" style="width:100%;margin-bottom:8px;">📆 Итоги года</button>
                <button class="btn" id="forecastBtn" style="width:100%;margin-bottom:8px;">🔮 Прогноз расходов</button>
                <div id="regularList"></div>
                <button class="btn btn-primary" id="addRegularBtn" style="width:100%;margin-top:8px;">+ Регулярный платёж</button>
            </div>
            <div id="tab-categories" class="tab-content platinum-only"><div id="customCatsList"></div><button class="btn btn-primary" id="addCatBtn" style="width:100%;margin-top:8px;">+ Добавить категорию</button></div>
        </div>

        <!-- Админ-панель -->
        <div id="screen-admin" class="screen hidden">
            <div class="flex" style="justify-content:space-between;margin-bottom:12px;">
                <h2>🛡 Админ-панель</h2>
                <button class="btn btn-danger" id="closeAdminBtn">Закрыть</button>
            </div>
            <div id="adminUserList"></div>
        </div>
    </div>

    <!-- ===== МОДАЛКА ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content" id="modalContent">
            <div id="modalBody"></div>
            <button class="btn" id="modalCloseBtn" style="width:100%;margin-top:12px;">Закрыть</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  ПОЛНОСТЬЮ ЛОКАЛЬНАЯ ВЕРСИЯ (localStorage)
        //  БЕЗ СЕРВЕРА
        // ============================================================

        // --- ДАННЫЕ ---
        let currentUser = null;
        let transactions = [];
        let piggyBanks = [];
        let challenges = [];
        let achievements = [];
        let debts = [];
        let regularPayments = [];
        let customCategories = { expense: [], income: [] };
        let shopItems = [
            { id: 'pro', name: '⭐ PRO (30 дней)', price: 500, action: 'pro', duration: 30 },
            { id: 'platinum', name: '💎 Platinum (30 дней)', price: 1000, action: 'platinum', duration: 30 },
            { id: 'pro_forever', name: '⭐ PRO навсегда', price: 1500, action: 'pro_forever', duration: 36500 },
            { id: 'platinum_forever', name: '💎 Platinum навсегда', price: 2500, action: 'platinum_forever', duration: 36500 },
            { id: 'stars_100', name: '⭐ 100 звёзд', price: 200, action: 'stars', amount: 100 },
        ];
        let selectedCategory = null;
        let currentType = 'expense';
        let timerInterval = null;

        const STORAGE_KEY = 'kosh_pro_data';

        function loadData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                try { return JSON.parse(raw); }
                catch(e) { /* fallback */ }
            }
            return {
                users: {}
            };
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function getUsers() {
            const data = loadData();
            return data.users || {};
        }

        function saveUsers(users) {
            const data = loadData();
            data.users = users;
            saveData(data);
        }

        // --- ТЕКУЩИЙ ПОЛЬЗОВАТЕЛЬ ---
        function getCurrentUser() {
            const id = localStorage.getItem('currentUserId');
            if (!id) return null;
            const users = getUsers();
            return users[id] || null;
        }

        function setCurrentUser(user) {
            localStorage.setItem('currentUserId', user.id);
            currentUser = user;
        }

        // --- РЕГИСТРАЦИЯ ---
        function registerUser(email, username, ref) {
            const users = getUsers();
            // Проверка уникальности
            for (let id in users) {
                if (users[id].email === email) return { error: 'Email уже используется' };
                if (users[id].username === username) return { error: 'Username уже используется' };
            }
            const id = Date.now().toString();
            const refCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            const newUser = {
                id,
                email,
                username,
                balance: 50,
                stars: 0,
                streak: 1,
                lastVisit: new Date().toISOString().split('T')[0],
                refCode,
                referrer: null,
                subLevel: 'free',
                subExpiry: null,
                registeredAt: new Date().toISOString(),
            };
            // Реферал
            if (ref) {
                const referrerUser = Object.values(users).find(u => u.refCode === ref);
                if (referrerUser) {
                    newUser.referrer = referrerUser.id;
                    referrerUser.stars = (referrerUser.stars || 0) + 100;
                    newUser.balance += 50; // дополнительный бонус
                    if (!referrerUser.referrals) referrerUser.referrals = [];
                    referrerUser.referrals.push(id);
                }
            }
            users[id] = newUser;
            saveUsers(users);
            setCurrentUser(newUser);
            return { success: true, user: newUser };
        }

        function loginUser(username) {
            const users = getUsers();
            const user = Object.values(users).find(u => u.username === username);
            if (!user) return { error: 'Пользователь не найден' };
            // Обновляем стрик
            updateStreak(user);
            saveUsers(users);
            setCurrentUser(user);
            return { success: true, user };
        }

        function updateStreak(user) {
            const today = new Date().toISOString().split('T')[0];
            if (!user.lastVisit) {
                user.streak = 1;
            } else if (user.lastVisit !== today) {
                const diff = Math.floor((Date.now() - new Date(user.lastVisit).getTime()) / 86400000);
                if (diff >= 2) {
                    user.streak = 0;
                } else if (diff === 1) {
                    user.streak += 1;
                }
                user.lastVisit = today;
            }
        }

        function updateUserOnServer(user) {
            const users = getUsers();
            users[user.id] = user;
            saveUsers(users);
            setCurrentUser(user);
        }

        // --- ЗАГРУЗКА ЛОКАЛЬНЫХ ДАННЫХ ПОЛЬЗОВАТЕЛЯ ---
        function loadUserLocalData() {
            if (!currentUser) return;
            const prefix = currentUser.id + '_';
            transactions = JSON.parse(localStorage.getItem(prefix + 'transactions') || '[]');
            piggyBanks = JSON.parse(localStorage.getItem(prefix + 'piggy') || '[]');
            challenges = JSON.parse(localStorage.getItem(prefix + 'challenges') || '[]');
            achievements = JSON.parse(localStorage.getItem(prefix + 'achievements') || '[]');
            debts = JSON.parse(localStorage.getItem(prefix + 'debts') || '[]');
            regularPayments = JSON.parse(localStorage.getItem(prefix + 'regular') || '[]');
            const cats = localStorage.getItem(prefix + 'customCats');
            customCategories = cats ? JSON.parse(cats) : { expense: [], income: [] };
        }

        function saveUserLocalData() {
            if (!currentUser) return;
            const prefix = currentUser.id + '_';
            localStorage.setItem(prefix + 'transactions', JSON.stringify(transactions));
            localStorage.setItem(prefix + 'piggy', JSON.stringify(piggyBanks));
            localStorage.setItem(prefix + 'challenges', JSON.stringify(challenges));
            localStorage.setItem(prefix + 'achievements', JSON.stringify(achievements));
            localStorage.setItem(prefix + 'debts', JSON.stringify(debts));
            localStorage.setItem(prefix + 'regular', JSON.stringify(regularPayments));
            localStorage.setItem(prefix + 'customCats', JSON.stringify(customCategories));
        }

        // --- UI ---
        function updateUI() {
            if (!currentUser) return;
            document.getElementById('userName').textContent = currentUser.username;
            document.getElementById('userEmail').textContent = currentUser.email;
            document.getElementById('userAvatar').textContent = currentUser.username[0].toUpperCase();
            document.getElementById('streakDisplay').textContent = '🔥 ' + currentUser.streak;
            document.getElementById('streakDisplay2').textContent = currentUser.streak;
            document.getElementById('coinsDisplay').textContent = '🪙 ' + currentUser.balance;
            document.getElementById('starsDisplay').textContent = '⭐ ' + (currentUser.stars || 0);
            document.getElementById('balanceDisplay').textContent = currentUser.balance.toLocaleString() + ' ₽';

            // Подписка
            const subInfo = document.getElementById('subInfo');
            if (currentUser.subLevel === 'free') {
                subInfo.textContent = '❌ Нет подписки';
            } else if (currentUser.subLevel === 'trial') {
                subInfo.textContent = '🟢 Пробный Platinum (3 дня)';
            } else if (currentUser.subLevel === 'pro') {
                subInfo.textContent = '⭐ PRO';
            } else if (currentUser.subLevel === 'pro_forever') {
                subInfo.textContent = '⭐ PRO навсегда';
            } else if (currentUser.subLevel === 'platinum') {
                subInfo.textContent = '💎 Platinum';
            } else if (currentUser.subLevel === 'platinum_forever') {
                subInfo.textContent = '💎 Platinum навсегда';
            }

            // Реферальная ссылка
            const link = window.location.origin + window.location.pathname + '?ref=' + currentUser.refCode;
            document.getElementById('referralLink').innerHTML = 'Ваша ссылка:<br><span style="font-size:12px;">' + link + '</span>';

            // Дневной лимит
            const limit = parseInt(localStorage.getItem('dailyLimit_' + currentUser.id)) || 0;
            const today = new Date().toISOString().split('T')[0];
            const todayExp = transactions.filter(t => t.type === 'expense' && t.date === today).reduce((s, t) => s + t.amount, 0);
            document.getElementById('limitText').textContent = limit ? 'Лимит: ' + limit + ' ₽' : 'Лимит: не задан';
            document.getElementById('limitStatus').style.display = (limit && todayExp > limit) ? 'inline' : 'none';

            // Обновляем таймер подписки
            updateTimer();
        }

        function updateTimer() {
            if (timerInterval) clearInterval(timerInterval);
            const el = document.getElementById('subTimer');
            if (!currentUser.subExpiry) {
                el.textContent = '';
                return;
            }
            const tick = () => {
                const rem = new Date(currentUser.subExpiry).getTime() - Date.now();
                if (rem <= 0) {
                    currentUser.subLevel = 'free';
                    currentUser.subExpiry = null;
                    updateUserOnServer(currentUser);
                    el.textContent = 'Подписка истекла';
                    clearInterval(timerInterval);
                    updateUI();
                    return;
                }
                const d = Math.floor(rem/86400000);
                const h = Math.floor((rem%86400000)/3600000);
                const m = Math.floor((rem%3600000)/60000);
                const s = Math.floor((rem%60000)/1000);
                el.textContent = `Осталось: ${d}д ${h}ч ${m}м ${s}с`;
            };
            tick();
            timerInterval = setInterval(tick, 1000);
        }

        function renderAll() {
            renderTransactions();
            renderAnalytics();
            renderShop();
            renderPiggy();
            renderChallenges();
            renderAchievements();
            renderDebts();
            renderRegular();
            renderCustomCategories();
        }

        function renderTransactions() {
            const container = document.getElementById('transactionList');
            if (transactions.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет записей</div>';
                return;
            }
            container.innerHTML = transactions.slice(0, 10).map(t =>
                `<div class="transaction-item"><span>${t.emoji} ${t.category}</span><span style="color:${t.type==='income'?'#34c759':'#ff3b30'};">${t.type==='income'?'+':'-'}${t.amount} ₽</span></div>`
            ).join('');
        }

        function renderAnalytics() {
            if (currentUser.subLevel === 'free') return;
            const tx = transactions.filter(t => t.type === 'expense');
            if (tx.length === 0) {
                document.getElementById('categoryStats').innerHTML = '';
                document.getElementById('avgDaily').textContent = '0 ₽';
                document.getElementById('topCategory').textContent = '-';
                return;
            }
            // График (простой canvas)
            const canvas = document.getElementById('expenseChart');
            const ctx = canvas.getContext('2d');
            const totals = {};
            tx.forEach(t => {
                if (!totals[t.category]) totals[t.category] = { emoji: t.emoji, total: 0 };
                totals[t.category].total += t.amount;
            });
            const total = Object.values(totals).reduce((s, c) => s + c.total, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const colors = ['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#FF8C00','#A9A9A9'];
            let start = -Math.PI/2, ci = 0, cx = canvas.width/2, cy = canvas.height/2, r = Math.min(cx, cy) - 10;
            Object.values(totals).forEach(cat => {
                const angle = (cat.total / total) * 2 * Math.PI;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, start, start + angle);
                ctx.closePath();
                ctx.fillStyle = colors[ci++ % colors.length];
                ctx.fill();
                start += angle;
            });

            // Статистика
            document.getElementById('categoryStats').innerHTML = Object.entries(totals).map(([cat, d]) =>
                `<div>${d.emoji} ${Math.round((d.total/total)*100)}%</div>`
            ).join('');

            const days = Math.max(1, Math.ceil((Date.now() - new Date(tx[tx.length-1].date).getTime()) / 86400000));
            const avg = tx.reduce((s, t) => s + t.amount, 0) / days;
            document.getElementById('avgDaily').textContent = Math.round(avg) + ' ₽';
            const top = Object.entries(totals).sort((a,b) => b[1].total - a[1].total)[0];
            document.getElementById('topCategory').textContent = top ? `${top[0]} (${top[1].total} ₽)` : '-';

        window.buyItem = function(id) {
            const item = shopItems.find(i => i.id === id);
            if (!item) return;
            if (currentUser.balance < item.price) return alert('Недостаточно монет');
            if (!confirm(`Купить "${item.name}"?`)) return;
            currentUser.balance -= item.price;
            if (item.action === 'stars') {
                currentUser.stars = (currentUser.stars || 0) + item.amount;
            } else {
                const duration = item.duration || 30;
                currentUser.subLevel = item.action;
                const now = Date.now();
                currentUser.subExpiry = now + duration * 24 * 60 * 60 * 1000;
                if (item.action === 'pro_forever' || item.action === 'platinum_forever') {
                    currentUser.subExpiry = now + 100 * 365 * 24 * 60 * 60 * 1000;
                }
            }
            updateUserOnServer(currentUser);
            updateUI();
            renderShop();
            if (currentUser.subLevel !== 'free') renderAnalytics();
            alert('Покупка совершена!');

        function openAddTransaction(type) {
            currentType = type;
            selectedCategory = null;
            const cats = type === 'expense' ? getExpenseCategories() : getIncomeCategories();
            let html = `<div class="text-center" style="font-weight:600;font-size:18px;margin-bottom:12px;">${type === 'expense' ? 'Расход' : 'Доход'}</div>
                <input type="number" id="txAmount" class="input-field" placeholder="Сумма">
                <div class="category-grid">`;
            cats.forEach(cat => {
                html += `<div class="category-item" data-cat='${JSON.stringify(cat)}'>${cat.emoji}<br><span style="font-size:12px;">${cat.name}</span></div>`;
            });
            html += `</div><button class="btn btn-primary" id="saveTxBtn" style="width:100%;">Добавить</button>`;
            openModal(html);
            document.querySelectorAll('.category-item').forEach(el => {
                el.addEventListener('click', function() {
                    document.querySelectorAll('.category-item').forEach(e => e.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedCategory = JSON.parse(this.dataset.cat);
                });
            });
            document.getElementById('saveTxBtn').addEventListener('click', () => {
                const amount = parseFloat(document.getElementById('txAmount').value);
                if (!amount || amount <= 0) return alert('Введите сумму');
                if (!selectedCategory) return alert('Выберите категорию');
                transactions.unshift({
                    type: currentType,
                    category: selectedCategory.name,
                    emoji: selectedCategory.emoji,
                    amount,
                    date: new Date().toISOString().split('T')[0]
                });
                currentUser.balance += currentType === 'income' ? amount : -amount;
                updateUserOnServer(currentUser);
                saveUserLocalData();
                renderAll();
                updateUI();
                closeModal();
            });
        }

        function getExpenseCategories() {
            let cats = [

            ];
            if (currentUser.subLevel === 'pro' || currentUser.subLevel === 'pro_forever' ||
                currentUser.subLevel === 'platinum' || currentUser.subLevel === 'platinum_forever' ||
                currentUser.subLevel === 'trial') {
                cats = cats.concat([
                    {emoji:'💊',name:'Здоровье'},{emoji:'📚',name:'Образование'},
                    {emoji:'🎁',name:'Подарки'},{emoji:'👕',name:'Одежда'}
                ]);

            if (currentUser.subLevel === 'platinum' || currentUser.subLevel === 'platinum_forever' || currentUser.subLevel === 'trial') {
                cats = cats.concat([
                    {emoji:'💻',name:'Техника'},{emoji:'🐱',name:'Питомцы'}
                ]);

            cats = cats.concat(customCategories.expense);

        window.adminGive = function(uid, type, amount) {
            const users = getUsers();
            const user = users[uid];
            if (!user) return alert('Пользователь не найден');
            if (type === 'coins') user.balance += amount;
            else if (type === 'stars') user.stars = (user.stars || 0) + amount;
            saveUsers(users);
            if (uid === currentUser.id) {
                currentUser = user;
                updateUI();
            }
            renderAdminPanel();
        };

        window.adminSub = function(uid, level, duration) {
            const users = getUsers();
            const user = users[uid];
            if (!user) return alert('Пользователь не найден');
            if (level === 'free') {
                user.subLevel = 'free';
                user.subExpiry = null;
            } else {
                user.subLevel = level;
                const now = Date.now();
                user.subExpiry = now + duration * 24 * 60 * 60 * 1000;
            }
            saveUsers(users);
            if (uid === currentUser.id) {
                currentUser = user;
                updateUI();
            }
            renderAdminPanel();
        };

        document.getElementById('inviteBtn').addEventListener('click', () => {
            const link = window.location.origin + window.location.pathname + '?ref=' + currentUser.refCode;
            navigator.clipboard.writeText(link).then(() => alert('Ссылка скопирована!')).catch(() => alert('Скопируйте вручную: ' + link));
        });
        document.getElementById('closeAdminBtn').addEventListener('click', () => {
            document.querySelector('.nav-btn[data-screen="transactions"]').click();
        });
        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('Сбросить все финансовые данные?')) {
                transactions = [];
                currentUser.balance = 0;
                saveUserLocalData();
                updateUserOnServer(currentUser);
                renderAll();
                updateUI();
                alert('Сброшено');
            }
        });
        document.getElementById('viewAllBtn').addEventListener('click', () => {
            openModal(`<div class="text-center" style="font-weight:600;font-size:18px;margin-bottom:12px;">Все операции</div><div id="allTxList"></div>`);
            const container = document.getElementById('allTxList');
            container.innerHTML = transactions.map(t =>
                `<div class="transaction-item"><span>${t.emoji} ${t.category}</span><span style="color:${t.type==='income'?'#34c759':'#ff3b30'};">${t.type==='income'?'+':'-'}${t.amount} ₽</span></div>`
            ).join('') || '<div class="empty-state">Нет записей</div>';
        });

        // --- ИНИЦИАЛИЗАЦИЯ ---
        (function init() {
            const savedUser = getCurrentUser();
            if (savedUser) {
                currentUser = savedUser;
                // Обновляем стрик
                updateStreak(currentUser);
                updateUserOnServer(currentUser);
                startApp();
            } else {
                document.getElementById('registerScreen').classList.remove('hidden');
                document.getElementById('mainScreen').classList.add('hidden');
                // Проверка реферального параметра
                const params = new URLSearchParams(window.location.search);
                const ref = params.get('ref');
                if (ref) {
                    // можно показать сообщение
                    console.log('Реферальный код:', ref);
                }
            }
        })();

        console.log('✅ Приложение запущено!');
    </script>
</body>
</html>
