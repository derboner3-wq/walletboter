<!-- Продолжение 2: начало JavaScript -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    // ==================== КОНФИГУРАЦИЯ ====================
    const ADMIN_USERNAMES = ['ok00112'];
    const DA_TOKEN = 'qlees6PnNamPz8cFOWW7s1yJJZEaafQ6wCmZelMW';
    const DA_LINK = 'https://dalink.to/hypercore';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzXsMArGxnOaZlmYI0q3_wmcjiIPqCDDYa9rns-yFrejyQC3nlavQFK_9uU2l80nYEx/exec';
    // =====================================================================

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    const safeTop = Math.max(tg.safeAreaInset?.top || 24, 50);
    document.documentElement.style.setProperty('--safe-top', safeTop + 'px');

    // Ключи CloudStorage
    const KEY_BAL = 'bal', KEY_TX = 'tx', KEY_LIM = 'lim', KEY_DARK = 'dark';
    const KEY_SUB_LVL = 'sub_lvl', KEY_SUB_EXP = 'sub_exp', KEY_TRIAL = 'trial';
    const KEY_PIG = 'pig', KEY_ACH = 'ach', KEY_CHAL = 'chal', KEY_DEBT = 'debt', KEY_REG = 'reg';
    const KEY_COINS = 'coins', KEY_USERS = 'users', KEY_TICKETS = 'tickets', KEY_SHOP = 'shop';
    const KEY_CUSTOM_CATS = 'custom_cats';

    let balance = 0, transactions = [], dailyLimit = 0, isDark = false;
    let subLevel = 'free', subExpiry = null, trialUsed = false;
    let currentType = 'expense', selectedCategory = null, timerInterval = null;
    let piggyBanks = [], achievements = [], challenges = [], debts = [], regularPayments = [];
    let coins = 0, users = {}, tickets = [], shopItems = [];
    let customCategories = { expense: [], income: [] };
    let activeTab = 'tab-piggy', adminActiveTab = 'users';
    let currentChatTicketId = null;

    const baseExpenseCats = [{emoji:'🍕',name:'Еда'},{emoji:'🚗',name:'Транспорт'},{emoji:'🏠',name:'Жильё'},{emoji:'🎉',name:'Развлечения'}];
    const proExpenseCats = [{emoji:'💊',name:'Здоровье'},{emoji:'📚',name:'Образование'},{emoji:'🎁',name:'Подарки'},{emoji:'👕',name:'Одежда'}];
    const platinumExpenseCats = [{emoji:'💻',name:'Техника'},{emoji:'🐱',name:'Питомцы'}];
    const incomeCats = [{emoji:'💼',name:'Зарплата'},{emoji:'💸',name:'Подработка'},{emoji:'🎁',name:'Подарок'},{emoji:'📈',name:'Инвестиции'}];

    function getExpenseCategories() {
        let cats = [];
        if (subLevel === 'platinum' || subLevel === 'platinum_forever' || subLevel === 'trial') {
            cats = [...baseExpenseCats, ...proExpenseCats, ...platinumExpenseCats, ...customCategories.expense];
        } else if (subLevel === 'pro' || subLevel === 'pro_forever') {
            cats = [...baseExpenseCats, ...proExpenseCats];
        } else {
            cats = [...baseExpenseCats];
        }
        return cats;
    }

    function getIncomeCategories() {
        return [...incomeCats, ...customCategories.income];
    }

    function cGet(key) { return new Promise(r => tg.CloudStorage.getItem(key, (e,v) => r(e?null:v))); }
    function cSet(key, val) { return new Promise(r => tg.CloudStorage.setItem(key, String(val), (e,ok) => r(ok))); }

    function defaultShop() {
        return [
            {id:'sub_pro', name:'Подписка PRO (30 дней)', desc:'Аналитика и PRO-категории', price:500, action:'pro'},
            {id:'sub_platinum', name:'Подписка Platinum (30 дней)', desc:'Все функции', price:1000, action:'platinum'},
            {id:'sub_pro_forever', name:'PRO навсегда', desc:'PRO без ограничений', price:1500, action:'pro_forever'},
            {id:'sub_platinum_forever', name:'Platinum навсегда', desc:'Все функции навсегда', price:2500, action:'platinum_forever'},
            {id:'ach_bronze', name:'Трофей "Бронзовый инвестор"', desc:'Красивый бейдж', price:200, icon:'🥉', action:'achievement'},
            {id:'ach_silver', name:'Трофей "Серебряный магнат"', desc:'Престижный бейдж', price:500, icon:'🥈', action:'achievement'},
            {id:'ach_gold', name:'Трофей "Золотой олигарх"', desc:'Элитный бейдж', price:1000, icon:'🥇', action:'achievement'},
            {id:'theme_custom', name:'Уникальная тема', desc:'Эксклюзивная тёмная тема', price:300, action:'theme'}
        ];
    }

    // ========== УРОВНИ ==========
    function getUserLevel() {
        const count = transactions.length;
        if (count >= 200) return { name: 'Магнат', emoji: '👑' };
        if (count >= 100) return { name: 'Эксперт', emoji: '🎓' };
        if (count >= 50) return { name: 'Профи', emoji: '💼' };
        if (count >= 10) return { name: 'Любитель', emoji: '⭐' };
        return { name: 'Новичок', emoji: '🌱' };
    }

    function updateUserLevel() {
        const level = getUserLevel();
        document.getElementById('userLevel').textContent = `${level.emoji} ${level.name}`;
    }

    // ========== СВОИ КАТЕГОРИИ ==========
    async function loadCustomCategories() {
        const raw = await cGet(KEY_CUSTOM_CATS);
        if (raw) {
            customCategories = JSON.parse(raw);
        } else {
            customCategories = { expense: [], income: [] };
        }
    }

    async function saveCustomCategories() {
        await cSet(KEY_CUSTOM_CATS, JSON.stringify(customCategories));
    }

    function renderCustomCategoriesList() {
        const container = document.getElementById('customCategoriesList');
        let html = '<div class="section-title">Расходы</div>';
        customCategories.expense.forEach((cat, i) => {
            html += `<div class="shop-item"><div>${cat.emoji} ${cat.name}</div><button class="btn btn-danger" style="padding:6px 10px;font-size:12px;" onclick="deleteCustomCat('expense',${i})">✕</button></div>`;
        });
        html += '<div class="section-title">Доходы</div>';
        customCategories.income.forEach((cat, i) => {
            html += `<div class="shop-item"><div>${cat.emoji} ${cat.name}</div><button class="btn btn-danger" style="padding:6px 10px;font-size:12px;" onclick="deleteCustomCat('income',${i})">✕</button></div>`;
        });
        container.innerHTML = html || '<p style="color:var(--hint);">Нет своих категорий</p>';
    }

    window.deleteCustomCat = async function(type, index) {
        customCategories[type].splice(index, 1);
        await saveCustomCategories();
        renderCustomCategoriesList();
    };

    document.getElementById('addCustomCategoryBtn').addEventListener('click', () => {
        document.getElementById('customCatModalTitle').textContent = 'Новая категория';
        document.getElementById('customCatName').value = '';
        document.getElementById('customCatEmoji').value = '';
        document.getElementById('customCatType').value = 'expense';
        document.getElementById('customCategoryModal').classList.add('active');
    });

    document.getElementById('closeCustomCatModal').addEventListener('click', () => {
        document.getElementById('customCategoryModal').classList.remove('active');
    });

    document.getElementById('saveCustomCatBtn').addEventListener('click', async () => {
        const name = document.getElementById('customCatName').value.trim();
        const emoji = document.getElementById('customCatEmoji').value.trim() || '📌';
        const type = document.getElementById('customCatType').value;
        if (!name) return tg.showAlert('Введите название');
        customCategories[type].push({ name, emoji });
        await saveCustomCategories();
        renderCustomCategoriesList();
        document.getElementById('customCategoryModal').classList.remove('active');
    });

    // ========== СИНХРОНИЗАЦИЯ С GOOGLE SHEETS ==========
    async function syncUserWithSheet() {
        const uid = tg.initDataUnsafe.user.id;
        const name = tg.initDataUnsafe.user.first_name || 'User';
        try {
            await fetch(`${SCRIPT_URL}?action=register&uid=${uid}&name=${encodeURIComponent(name)}&sub=${subLevel}&coins=${coins}&balance=${balance}`);
        } catch(e) {}
    }

    async function saveUsers() { await cSet(KEY_USERS, JSON.stringify(users)); }
    async function saveTickets() { await cSet(KEY_TICKETS, JSON.stringify(tickets)); }
    async function saveShop() { await cSet(KEY_SHOP, JSON.stringify(shopItems)); }

    async function loadAll() {
        const [b,tx,lim,dark,lvl,exp,trial,pig,ach,chal,debt,reg,c,us,tic,shop] = await Promise.all([
            cGet(KEY_BAL),cGet(KEY_TX),cGet(KEY_LIM),cGet(KEY_DARK),
            cGet(KEY_SUB_LVL),cGet(KEY_SUB_EXP),cGet(KEY_TRIAL),
            cGet(KEY_PIG),cGet(KEY_ACH),cGet(KEY_CHAL),cGet(KEY_DEBT),cGet(KEY_REG),
            cGet(KEY_COINS),cGet(KEY_USERS),cGet(KEY_TICKETS),cGet(KEY_SHOP)
        ]);
        balance = b?+b:0; transactions = tx?JSON.parse(tx):[]; dailyLimit = lim?+lim:0; isDark = dark==='true';
        if (lvl&&exp) { const e=+exp; if(Date.now()<e){subLevel=lvl;subExpiry=e;} else {subLevel='free';subExpiry=null;} }
        trialUsed = trial==='true';
        piggyBanks = pig?JSON.parse(pig):[]; achievements = ach?JSON.parse(ach):[];
        challenges = chal?JSON.parse(chal):[]; debts = debt?JSON.parse(debt):[];
        regularPayments = reg?JSON.parse(reg):[]; coins = c?+c:0;
        users = us?JSON.parse(us):{}; tickets = tic?JSON.parse(tic):[];
        shopItems = shop?JSON.parse(shop):defaultShop();
        await loadCustomCategories();

        const uid = tg.initDataUnsafe.user.id;
        if (!users[uid]) {
            users[uid] = {first_name:tg.initDataUnsafe.user.first_name||'User', balance:0, coins:0, sub:'free', joined:Date.now()};
        } else {
            users[uid].first_name = tg.initDataUnsafe.user.first_name||users[uid].first_name;
        }
        if (users[uid].sub && users[uid].sub !== 'free' && users[uid].sub_expiry && Date.now() < users[uid].sub_expiry) {
            subLevel = users[uid].sub;
            subExpiry = users[uid].sub_expiry;
            trialUsed = users[uid].trial_used || false;
        }
        if (users[uid].coins !== undefined) {
            coins = users[uid].coins;
        }
        await saveUsers();
        await syncUserWithSheet();

        document.getElementById('dailyLimitInput').value = dailyLimit||'';
        applyTheme(); updateUI(); renderAll();
        if (subLevel!=='free') updateTimer();
        if (subLevel==='pro'||subLevel==='pro_forever'||subLevel==='platinum'||subLevel==='platinum_forever'||subLevel==='trial') renderExtra();
        updateCoinsDisplay();
        updateUserLevel();
        checkRegularPayments();
    }

    async function saveFin() { await Promise.all([cSet(KEY_BAL,balance),cSet(KEY_TX,JSON.stringify(transactions)),cSet(KEY_LIM,dailyLimit),cSet(KEY_DARK,isDark)]); }
    async function saveSub() { await Promise.all([cSet(KEY_SUB_LVL,subLevel),cSet(KEY_SUB_EXP,subExpiry||0),cSet(KEY_TRIAL,trialUsed)]); }
    async function savePlat() { await Promise.all([cSet(KEY_PIG,JSON.stringify(piggyBanks)),cSet(KEY_ACH,JSON.stringify(achievements)),cSet(KEY_CHAL,JSON.stringify(challenges)),cSet(KEY_DEBT,JSON.stringify(debts)),cSet(KEY_REG,JSON.stringify(regularPayments)),cSet(KEY_COINS,coins)]); }

    function updateCoinsDisplay() { document.getElementById('coinsDisplay').textContent = `🪙 ${coins}`; const e=document.getElementById('coinsBalance'); if(e)e.textContent=coins; }
    function addCoins(n) { coins+=n; updateCoinsDisplay(); savePlat(); syncUserWithSheet(); }
    function spendCoins(n) { if(coins<n){tg.showAlert('Недостаточно монет');return false;} coins-=n; updateCoinsDisplay(); savePlat(); syncUserWithSheet(); return true; }

    function openCoins() { document.getElementById('coinsBalance').textContent=coins; document.getElementById('donateStatus').textContent=''; document.getElementById('coinsModal').classList.add('active'); }
    document.getElementById('closeCoinsModal').addEventListener('click',()=>document.getElementById('coinsModal').classList.remove('active'));
    document.getElementById('startDonateBtn').addEventListener('click',()=>{
        const uid=tg.initDataUnsafe.user.id;
        tg.openLink(`${DA_LINK}?message=${uid}`);
        document.getElementById('donateStatus').textContent='⏳ Ожидаем оплату...';
        startCheck(uid);
    });

    function startCheck(uid) { let attempts=0; const max=30; const iv=setInterval(async()=>{ attempts++; const ok=await checkDonation(uid); if(ok){clearInterval(iv);addCoins(100);document.getElementById('coinsBalance').textContent=coins;document.getElementById('donateStatus').textContent='✅ 100 монет зачислено!';tg.showAlert('100 монет получено!');} else if(attempts>=max){clearInterval(iv);document.getElementById('donateStatus').textContent='❌ Оплата не найдена.';} },10000); }
    async function checkDonation(uid) { try { const r=await fetch('https://www.donationalerts.com/api/v1/alerts/donations',{headers:{'Authorization':`Bearer ${DA_TOKEN}`}}); const d=await r.json(); return (d.data||[]).some(x=>x.amount>=99&&x.message&&x.message.includes(String(uid))); } catch(e){return false;} }

    function isAdmin() { const u=tg.initDataUnsafe.user.username; return u&&ADMIN_USERNAMES.includes(u.toLowerCase()); }

    // ========== НАВИГАЦИЯ ==========
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const screen = btn.dataset.screen;
            if (screen === 'admin') {
                openAdminFullscreen();
                return;
            }
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + screen).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (screen === 'analytics' && subLevel !== 'free') {
                drawChart(); updateCatStats(); updateAdvStats();
            }
            if (screen === 'shop') renderShop();
            if (screen === 'more') renderExtra();
        });
    });

    if (isAdmin()) document.getElementById('adminNavBtn').style.display = 'flex';

    // ========== АДМИН-ПАНЕЛЬ (полноэкранная) ==========
    function openAdminFullscreen() {
        document.getElementById('adminFullscreen').classList.add('active');
        fetch(`${SCRIPT_URL}?action=list`)
            .then(r => r.json())
            .then(data => renderAdminUsersFromSheet(data));
        renderAdminShop();
        renderAdminTickets();
        renderAdminStats();
    }

    document.getElementById('closeAdminFullscreen').addEventListener('click', ()=>{
        document.getElementById('adminFullscreen').classList.remove('active');
    });

    document.getElementById('userAvatar').addEventListener('click',()=>{ if(isAdmin()){ openAdminFullscreen(); } });

    function renderAdminUsersFromSheet(usersArray) {
        const c = document.getElementById('admin-users');
        c.innerHTML = '<div class="section-title">Пользователи</div>';
        usersArray.forEach(u => {
            c.innerHTML += `<div class="admin-user-card">
                <div>
                    <div>${u.first_name} (ID: ${u.user_id})</div>
                    <div style="font-size:12px;">Подписка: ${u.sub||'free'} | Баланс: ${u.balance||0} ₽ | Монеты: ${u.coins||0}</div>
                </div>
                <div style="display:flex;gap:4px;">
                    <button class="btn btn-primary" style="padding:6px 10px;font-size:12px;" onclick="adminSetSubSheet('${u.user_id}','pro')">PRO 30д</button>
                    <button class="btn btn-primary" style="padding:6px 10px;font-size:12px;" onclick="adminSetSubSheet('${u.user_id}','platinum')">Plat 30д</button>
                    <button class="btn btn-primary" style="padding:6px 10px;font-size:12px; background:linear-gradient(135deg,#ffd700,#ff8c00);" onclick="adminSetSubSheet('${u.user_id}','pro_forever')">PRO ∞</button>
                    <button class="btn btn-primary" style="padding:6px 10px;font-size:12px; background:linear-gradient(135deg,#ffd700,#ff8c00);" onclick="adminSetSubSheet('${u.user_id}','platinum_forever')">Plat ∞</button>
                    <button class="btn btn-danger" style="padding:6px 10px;font-size:12px;" onclick="adminSetSubSheet('${u.user_id}','free')">Сброс</button>
                    <button class="btn btn-gold" style="padding:6px 10px;font-size:12px;" onclick="adminAddCoinsSheet('${u.user_id}',500)">+500🪙</button>
                </div>
            </div>`;
        });
    }

    window.adminSetSubSheet = async (uid, lvl) => {
        await fetch(`${SCRIPT_URL}?action=register&uid=${uid}&name=&sub=${lvl}&coins=0&balance=0`);
        fetch(`${SCRIPT_URL}?action=list`).then(r=>r.json()).then(renderAdminUsersFromSheet);
    };

    window.adminAddCoinsSheet = async (uid, amount) => {
        const resp = await fetch(`${SCRIPT_URL}?action=list`);
        const users = await resp.json();
        const user = users.find(u => u.user_id == uid);
        if (user) {
            const newCoins = (user.coins || 0) + amount;
            await fetch(`${SCRIPT_URL}?action=register&uid=${uid}&name=${encodeURIComponent(user.first_name)}&sub=${user.sub}&coins=${newCoins}&balance=${user.balance}`);
            fetch(`${SCRIPT_URL}?action=list`).then(r=>r.json()).then(renderAdminUsersFromSheet);
        }
    };

    function renderAdminShop() { document.getElementById('adminShopList').innerHTML=shopItems.map((it,i)=>`<div class="shop-item"><div><div>${it.icon?it.icon+' ':''}${it.name}</div><div style="font-size:12px;">${it.desc} | 🪙${it.price}</div></div><button class="btn btn-danger" style="padding:6px 10px;font-size:12px;" onclick="delShop(${i})">✕</button></div>`).join(''); }
    window.delShop=async(i)=>{shopItems.splice(i,1);await saveShop();renderAdminShop();};

    document.getElementById('addShopItemBtn').addEventListener('click',()=>{ document.getElementById('adminShopItemTitle').textContent='Добавить товар'; ['shopItemName','shopItemDesc','shopItemPrice','shopItemIcon'].forEach(id=>document.getElementById(id).value=''); document.getElementById('adminShopItemModal').classList.add('active'); });
    document.getElementById('closeAdminShopItemModal').addEventListener('click',()=>document.getElementById('adminShopItemModal').classList.remove('active'));
    document.getElementById('saveShopItemBtn').addEventListener('click',async()=>{ const n=document.getElementById('shopItemName').value, d=document.getElementById('shopItemDesc').value; const p=parseInt(document.getElementById('shopItemPrice').value), a=document.getElementById('shopItemAction').value; const ic=document.getElementById('shopItemIcon').value; if(!n||!p)return tg.showAlert('Название и цена обязательны'); shopItems.push({id:'shop_'+Date.now(),name:n,desc:d,price:p,action:a,icon:a==='achievement'?ic:undefined}); await saveShop(); document.getElementById('adminShopItemModal').classList.remove('active'); renderAdminShop(); });

    function renderAdminTickets() { const c=document.getElementById('adminTicketsList'); c.innerHTML=tickets.length?'':'<p style="color:var(--hint);">Нет обращений</p>'; tickets.forEach((t,i)=>{ let btns=''; if(t.status==='new') btns=`<button class="btn btn-primary" style="padding:6px 10px;" onclick="takeTicket('${t.id}')">Взять в работу</button>`; else if(t.status==='in_progress') btns=`<button class="btn btn-primary" style="padding:6px 10px;" onclick="openAdminChat('${t.id}')">Чат</button> <button class="btn btn-danger" style="padding:6px 10px;" onclick="closeTicket('${t.id}')">Закрыть</button>`; c.innerHTML+=`<div style="background:var(--secondary-bg);border-radius:12px;padding:12px;margin-bottom:8px;"><div><b>${t.user_name}</b> (ID: ${t.user_id})</div><div style="font-size:13px;">${t.messages[0]?.text?.substring(0,100)||''}</div><div style="font-size:12px;">${new Date(t.messages[0]?.date).toLocaleString()}</div>${btns}</div>`; }); }
    window.takeTicket=async(tid)=>{ const t=tickets.find(x=>x.id===tid); if(t){t.status='in_progress';await saveTickets();renderAdminTickets();} };
    window.openAdminChat=function(tid){ currentChatTicketId=tid; renderChatMessages(tid); document.getElementById('chatModal').classList.add('active'); };
    window.closeTicket=async(tid)=>{ const t=tickets.find(x=>x.id===tid); if(t){t.status='closed';await saveTickets();renderAdminTickets();} };

    function renderAdminStats() { const total=Object.keys(users).length, bal=Object.values(users).reduce((s,u)=>s+(u.balance||0),0), co=Object.values(users).reduce((s,u)=>s+(u.coins||0),0); document.getElementById('adminStatsData').innerHTML=`<div class="stat-item"><div class="stat-value">${total}</div><div class="stat-label">Пользователей</div></div><div class="stat-item"><div class="stat-value">${bal} ₽</div><div class="stat-label">Общий баланс</div></div><div class="stat-item"><div class="stat-value">${co} 🪙</div><div class="stat-label">Монет выпущено</div></div>`; }

    // ========== ПОДДЕРЖКА И ЧАТ ==========
    document.getElementById('openSupportBtn').addEventListener('click',()=>{ const myTickets=tickets.filter(t=>t.user_id===tg.initDataUnsafe.user.id); const list=document.getElementById('myTicketsList'); list.innerHTML=myTickets.map(t=>`<div style="background:var(--secondary-bg);border-radius:12px;padding:12px;margin-bottom:8px;"><div>${t.messages[0]?.text?.substring(0,50)||'Без текста'}</div><div style="font-size:12px;">Статус: ${t.status}</div>${t.status==='in_progress'?`<button class="btn btn-primary" onclick="openUserChat('${t.id}')">Чат</button>`:''}</div>`).join('')||'<p style="color:var(--hint);">Нет тикетов</p><button class="btn btn-primary" id="createTicketBtn" style="width:100%;margin-top:8px;">Создать тикет</button>'; document.getElementById('myTicketsModal').classList.add('active'); });
    document.getElementById('closeMyTicketsModal').addEventListener('click',()=>document.getElementById('myTicketsModal').classList.remove('active'));
    document.getElementById('myTicketsList').addEventListener('click',(e)=>{ if(e.target.id==='createTicketBtn'){ const msg=prompt('Опишите проблему:'); if(msg){ const ticket={ id:'ticket_'+Date.now(), user_id:tg.initDataUnsafe.user.id, user_name:tg.initDataUnsafe.user.first_name||'User', status:'new', messages:[{sender:'user',text:msg,date:Date.now()}] }; tickets.push(ticket); saveTickets(); document.getElementById('myTicketsModal').classList.remove('active'); tg.showAlert('Тикет создан'); } } });
    window.openUserChat=function(tid){ currentChatTicketId=tid; renderChatMessages(tid); document.getElementById('chatModal').classList.add('active'); };

    document.getElementById('sendChatBtn').addEventListener('click',async()=>{ const text=document.getElementById('chatInput').value.trim(); const photoFile=document.getElementById('chatPhotoInput').files[0]; if(!text&&!photoFile)return; const ticket=tickets.find(t=>t.id===currentChatTicketId); if(!ticket)return; const sender=isAdmin()?'admin':'user'; let photoData=null; if(photoFile){ photoData=await new Promise(resolve=>{ const reader=new FileReader(); reader.onload=e=>resolve(e.target.result); reader.readAsDataURL(photoFile); }); } ticket.messages.push({sender,text,photo:photoData,date:Date.now()}); await saveTickets(); document.getElementById('chatInput').value=''; document.getElementById('chatPhotoInput').value=''; renderChatMessages(currentChatTicketId); });
    function renderChatMessages(tid){ const t=tickets.find(x=>x.id===tid); if(!t)return; const container=document.getElementById('chatMessages'); container.innerHTML=t.messages.map(m=>{ let content=''; if(m.text)content+=`<div class="chat-bubble">${m.text}</div>`; if(m.photo)content+=`<img src="${m.photo}" class="chat-photo">`; return `<div class="chat-message ${m.sender}">${content}</div>`; }).join(''); container.scrollTop=container.scrollHeight; }
    setInterval(async()=>{ if(document.getElementById('chatModal').classList.contains('active')&&currentChatTicketId){ const raw=await cGet(KEY_TICKETS); if(raw)tickets=JSON.parse(raw); renderChatMessages(currentChatTicketId); } },3000);

    function applyTheme() { if(isDark)document.body.classList.add('dark-theme');else document.body.classList.remove('dark-theme'); document.getElementById('themeToggle').checked=isDark; }
    async function setSub(lvl,dur) { subLevel=lvl; subExpiry=Date.now()+dur; if(lvl==='trial')trialUsed=true; await saveSub(); await syncUserWithSheet(); updateUI(); renderAll(); updateTimer(); if(subLevel==='pro'||subLevel==='pro_forever'||subLevel==='platinum'||subLevel==='platinum_forever'||subLevel==='trial')renderExtra(); }

    function checkRegularPayments() {
        const today = new Date().toISOString().split('T')[0];
        const due = regularPayments.filter(p => !p.lastPaid || p.lastPaid !== today);
        if (due.length === 0) return;
        let message = '📅 Напоминание о регулярных платежах:\n';
        due.forEach(p => {
            message += `- ${p.name}: ${p.amount} ₽\n`;
            p.lastPaid = today;
        });
        tg.showPopup({
            title: 'Регулярные платежи',
            message: message,
            buttons: [{ type: 'ok', text: 'Оплатить' }, { type: 'cancel', text: 'Закрыть' }]
        }, (btn) => {
            if (btn === 'ok') {
                due.forEach(p => {
                    if (balance >= p.amount) {
                        balance -= p.amount;
                        transactions.unshift({
                            type: 'expense',
                            category: 'Регулярный платёж',
                            emoji: '📅',
                            amount: p.amount,
                            date: today
                        });
                    }
                });
                saveFin();
                savePlat();
                renderAll();
                updateUserLevel();
            }
        });
    }
